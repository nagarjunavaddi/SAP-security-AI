<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Assistant — IK° Kontrol</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg:#FFFFFF;
      --tint:#F5F7FA;
      --tint-2:#EDF2F8;
      --ink:#12181F;
      --ink-soft:#5A6A85;
      --line:#DCE5F0;
      --navy:#0C2438;
      --navy-2:#123252;
      --blue:#1F497D;
      --brass:#B0894F;
      --red:#C33438;
      --font-display:'Fraunces',serif;
      --font-body:'Inter',sans-serif;
      --font-mono:'IBM Plex Mono',monospace;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: var(--font-body); background: var(--tint); color: var(--ink-soft); height: 100vh; display: flex; flex-direction: column; -webkit-font-smoothing:antialiased; }
    ::selection{ background:var(--navy); color:#fff; }

    /* ====== Corp bar ====== */
    .corp-bar{ background:#081A2A; height:32px; display:flex; align-items:center; padding:0 32px; flex-shrink:0; }
    .corp-bar-inner{ max-width:1180px; width:100%; margin:0 auto; display:flex; justify-content:space-between; align-items:center; }
    .corp-name{ font-family:var(--font-mono); font-size:11px; letter-spacing:1px; color:#8FA3C4; text-transform:uppercase; }
    .corp-tag{ font-family:var(--font-mono); font-size:10px; letter-spacing:2px; color:#5C7392; text-transform:uppercase; }

    /* ====== Nav ====== */
    .ik-nav{ background:var(--navy); padding:0 32px; height:52px; display:flex; align-items:center; flex-shrink:0; }
    .ik-nav-inner{ max-width:1180px; width:100%; margin:0 auto; display:flex; justify-content:space-between; align-items:center; }
    .ik-brand{ font-family:var(--font-display); font-weight:700; font-size:22px; color:#fff; text-decoration:none; letter-spacing:0.2px; }
    .ik-gold{ color:var(--brass); }
    .ik-nav-links{ display:flex; align-items:center; gap:18px; }
    .nav-user{ font-family:var(--font-mono); font-size:12px; color:#B9C2D6; }
    .signout-btn{ font-family:var(--font-mono); font-size:11px; color:#8FA3C4; background:none; border:1px solid rgba(255,255,255,0.2); padding:6px 14px; border-radius:6px; cursor:pointer; text-decoration:none; transition:all .15s; }
    .signout-btn:hover{ border-color:var(--brass); color:var(--brass); }

    /* ====== Page head ====== */
    .page-head { background: var(--navy); padding: 24px 32px; flex-shrink:0; }
    .page-head-inner { max-width:1180px; margin:0 auto; }
    .page-head .back-link { display:inline-flex; align-items:center; gap:6px; font-family:var(--font-mono); font-size:12px; color: #B9C2D6; text-decoration: none; margin-bottom:12px; }
    .page-head .back-link:hover { color:#fff; }
    .page-head h2 { color: #fff; font-family:var(--font-display); font-size: 28px; font-weight: 700; letter-spacing:0.2px; }

    .chat-container { flex: 1; display: flex; flex-direction: column; max-width: 900px; width: 100%; margin: 0 auto; padding: 16px; overflow: hidden; }

    .messages-area { flex: 1; overflow-y: auto; padding: 8px 0; display: flex; flex-direction: column; gap: 12px; }

    .welcome-msg { text-align: center; padding: 60px 20px; }
    .welcome-msg h3 { color: var(--navy); font-family:var(--font-display); font-weight:700; font-size: 24px; margin-bottom: 8px; }
    .welcome-msg p { color: var(--ink-soft); font-size: 14px; margin-bottom: 20px; }
    .quick-btns { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
    .quick-btn { background: #fff; border: 1px solid var(--line); border-radius: 20px; padding: 8px 16px; font-size: 13px; color: var(--navy); cursor: pointer; transition: all 0.2s; }
    .quick-btn:hover { background: var(--tint-2); border-color: var(--brass); }

    .msg { display: flex; gap: 10px; max-width: 85%; animation: fadeIn 0.3s ease; }
    .msg.user { align-self: flex-end; flex-direction: row-reverse; }
    .msg.ai { align-self: flex-start; }

    .msg-avatar { width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-family:var(--font-mono); font-size: 12px; font-weight: 600; flex-shrink: 0; }
    .msg.user .msg-avatar { background: var(--navy); color: #fff; }
    .msg.ai .msg-avatar { background: var(--brass); color: #fff; }

    .msg-bubble { padding: 12px 16px; border-radius: 12px; font-size: 14px; line-height: 1.6; }
    .msg.user .msg-bubble { background: var(--navy); color: #fff; border-bottom-right-radius: 4px; }
    .msg.ai .msg-bubble { background: #fff; color: #333; border: 1px solid var(--line); border-bottom-left-radius: 4px; }
    .msg.ai .msg-bubble strong { color: var(--navy); }

    .msg-tools { margin-top: 8px; padding: 6px 10px; background: var(--tint); border-radius: 6px; font-family:var(--font-mono); font-size: 11px; color: var(--ink-soft); }
    .msg-tools span { color: var(--brass); font-weight: 600; }

    .typing-indicator { display: flex; align-items: center; gap: 10px; padding: 8px 0; }
    .typing-dots { display: flex; gap: 4px; }
    .typing-dots span { width: 8px; height: 8px; background: var(--brass); border-radius: 50%; animation: bounce 1.4s infinite ease-in-out; }
    .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
    .typing-dots span:nth-child(3) { animation-delay: 0.4s; }

    .input-area { padding: 12px 0; border-top: 1px solid var(--line); display: flex; gap: 10px; }
    .input-area input { flex: 1; padding: 14px 18px; border: 1px solid var(--line); border-radius: 12px; font-family:var(--font-body); font-size: 14px; outline: none; background: #fff; transition: border 0.2s; }
    .input-area input:focus { border-color: var(--brass); }
    .input-area button { padding: 14px 24px; background: var(--navy); color: #fff; border: none; border-radius: 12px; font-family:var(--font-display); font-weight: 600; font-size: 14px; cursor: pointer; transition: background 0.2s; }
    .input-area button:hover { background: var(--navy-2); }
    .input-area button:disabled { background: var(--line); cursor: not-allowed; }

    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes bounce { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1); } }

    .msg.ai .msg-bubble ul { margin: 6px 0 6px 18px; }
    .msg.ai .msg-bubble li { margin-bottom: 3px; }
    .msg.ai .msg-bubble code { background: var(--tint-2); padding: 2px 6px; border-radius: 3px; font-family:var(--font-mono); font-size: 13px; }
  </style>
</head>
<body>
  <div class="corp-bar">
    <div class="corp-bar-inner">
      <span class="corp-name">InfoKrafts</span>
      <span class="corp-tag">Trust &middot; Quality &middot; Performance</span>
    </div>
  </div>
  <nav class="ik-nav">
    <div class="ik-nav-inner">
      <a href="index.html" class="ik-brand">IK<span class="ik-gold">°</span> Kontrol</a>
      <div class="ik-nav-links">
        <span class="nav-user" id="navUser"></span>
        <a href="#" class="signout-btn" onclick="sessionStorage.clear();location.href='login.html'">SIGN OUT</a>
      </div>
    </div>
  </nav>
  <div class="page-head">
    <div class="page-head-inner">
      <a href="index.html" class="back-link">&#8592; Back to dashboard</a>
      <h2>AI Assistant</h2>
    </div>
  </div>

  <div class="chat-container">
    <div class="messages-area" id="messagesArea">
      <div class="welcome-msg" id="welcomeMsg">
        <h3>IK° Kontrol AI Assistant</h3>
        <p>Ask me anything about your SAP security &mdash; users, roles, locks, authorizations.</p>
        
      </div>
    </div>

    <div class="input-area">
      <input type="text" id="chatInput" placeholder="Ask about SAP security..." onkeydown="if(event.key==='Enter')sendMessage()" />
      <button id="sendBtn" onclick="sendMessage()">Send</button>
    </div>
  </div>

  <script>
    const messagesArea = document.getElementById('messagesArea');
    const chatInput = document.getElementById('chatInput');
    const sendBtn = document.getElementById('sendBtn');
    const welcomeMsg = document.getElementById('welcomeMsg');
    let chatHistory = [];

    // Nav user
    try {
      const sess = JSON.parse(sessionStorage.getItem('user') || '{}');
      if (sess.displayName) document.getElementById('navUser').textContent = sess.displayName;
    } catch(e) {}

    function askQuick(btn) {
      chatInput.value = btn.textContent;
      sendMessage();
    }

    function addMessage(role, content, tools) {
      if (welcomeMsg) welcomeMsg.style.display = 'none';

      const div = document.createElement('div');
      div.className = 'msg ' + (role === 'user' ? 'user' : 'ai');

      const avatar = document.createElement('div');
      avatar.className = 'msg-avatar';
      avatar.textContent = role === 'user' ? 'U' : 'AI';

      const bubble = document.createElement('div');
      bubble.className = 'msg-bubble';
      bubble.innerHTML = formatMarkdown(content);

      div.appendChild(avatar);
      const contentWrap = document.createElement('div');
      contentWrap.appendChild(bubble);

      if (tools && tools.length > 0) {
        const toolDiv = document.createElement('div');
        toolDiv.className = 'msg-tools';
        toolDiv.innerHTML = 'SAP Call: <span>' + tools.map(t => t.tool).join(', ') + '</span>';
        contentWrap.appendChild(toolDiv);
      }

      div.appendChild(contentWrap);
      messagesArea.appendChild(div);
      messagesArea.scrollTop = messagesArea.scrollHeight;
    }

    function showTyping() {
      const div = document.createElement('div');
      div.className = 'typing-indicator';
      div.id = 'typingIndicator';
      div.innerHTML = '<div class="msg-avatar" style="background:#B0894F;color:#fff;width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;">AI</div><div class="typing-dots"><span></span><span></span><span></span></div>';
      messagesArea.appendChild(div);
      messagesArea.scrollTop = messagesArea.scrollHeight;
    }

    function hideTyping() {
      const el = document.getElementById('typingIndicator');
      if (el) el.remove();
    }

    function formatMarkdown(text) {
      if (!text) return '';
      let html = text
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
        .replace(/\*(.+?)\*/g, '<em>$1</em>')
        .replace(/`(.+?)`/g, '<code>$1</code>')
        .replace(/\n\n/g, '<br><br>')
        .replace(/\n\* /g, '\n<li>')
        .replace(/\n- /g, '\n<li>');

      if (html.includes('<li>')) {
        html = html.replace(/(<li>.*?)(?=<li>|<br>|$)/gs, '<ul>$1</ul>');
      }
      html = html.replace(/<\/ul>\s*<ul>/g, '');
      return html;
    }

    async function sendMessage() {
      const msg = chatInput.value.trim();
      if (!msg) return;

      chatInput.value = '';
      sendBtn.disabled = true;
      addMessage('user', msg);
      chatHistory.push({ role: 'user', content: msg });

      showTyping();

      try {
        const resp = await fetch('/api/ai/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: msg, history: chatHistory })
        });

        const data = await resp.json();
        hideTyping();

        if (data.success) {
          addMessage('ai', data.answer, data.sapCalls);
          chatHistory.push({ role: 'assistant', content: data.answer });
        } else {
          addMessage('ai', 'Error: ' + (data.error || 'Something went wrong'));
        }
      } catch (err) {
        hideTyping();
        addMessage('ai', 'Connection error: ' + err.message);
      }

      sendBtn.disabled = false;
      chatInput.focus();
    }
  </script>
</body>
</html>
