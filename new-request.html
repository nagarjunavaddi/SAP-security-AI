<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IK° Kontrol — New Access Request</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#0C2438; --navy-2:#14344F; --navy-corp:#14344F; --navy-dark:#0C2438;
    --brass:#B0894F; --blue:#2563A8;
    --paper:#FAFBFC; --paper-2:#F1F4F6; --line:#E4E9EC;
    --ink:#0C2438; --ink-soft:#5A6A7A; --ink-faint:#8A97A6;
    --slate:#5A6A7A; --slate-light:#8A97A6;
    --tint:#FAFBFC; --tint-2:#F1F4F6;
    --bg:#FFFFFF; --ice-1:#FAFBFC; --ice-2:#F1F4F6; --ice-3:#E4E9EC;
    --crimson:#B23A3A; --red:#B23A3A; --green:#1E7A46; --gold:#B0894F; --amber:#9A6B1E;
    --ok:#1E7A46; --ok-bg:#E4F3EA; --bad:#B23A3A; --bad-bg:#F8E7E7; --warn:#9A6B1E; --warn-bg:#FBF1DF;
    --font-display:'Fraunces',Georgia,serif; --font-body:'Inter',sans-serif; --font-mono:'IBM Plex Mono',monospace;
    --shadow-sm:0 1px 2px rgba(12,36,56,0.05); --shadow-md:0 8px 24px rgba(12,36,56,0.06); --shadow-lg:0 12px 40px rgba(12,36,56,0.10);
    --radius:14px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{ background:var(--paper); color:var(--ink); font-family:var(--font-body); -webkit-font-smoothing:antialiased; }
  ::selection{ background:var(--brass); color:#fff; }

  .corp-bar{ background:#fff; border-bottom:1px solid var(--line); }
  .corp-bar-inner{ max-width:1200px; margin:0 auto; height:38px; padding:0 28px; display:flex; align-items:center; justify-content:space-between; }
  .corp-wordmark{ font-family:var(--font-display); font-weight:600; font-size:16px; letter-spacing:-0.3px; }
  .corp-wordmark .info{ color:var(--navy); } .corp-wordmark .krafts{ color:var(--blue); }
  .corp-tag{ font-family:var(--font-mono); font-size:10px; font-weight:500; color:var(--brass); text-transform:uppercase; letter-spacing:2px; }

  .ik-nav{ background:var(--navy); padding:0 28px; position:sticky; top:0; z-index:100; box-shadow:0 2px 16px rgba(12,36,56,0.25); }
  .ik-nav-inner{ max-width:1200px; margin:0 auto; display:flex; align-items:center; justify-content:space-between; height:58px; }
  .ik-brand{ font-family:var(--font-display); font-weight:500; font-size:23px; color:#F2F5F8; text-decoration:none; letter-spacing:-0.3px; display:inline-flex; align-items:baseline; }
  .ik-brand .deg{ color:var(--brass); font-size:16px; position:relative; top:-3px; margin:0 1px; }
  .ik-brand .name{ margin-left:5px; }
  .ik-gold{ color:var(--brass); }
  .ik-nav-links{ display:flex; gap:6px; align-items:center; }
  .ik-nav-links a{ font-family:var(--font-mono); font-size:11px; text-transform:uppercase; letter-spacing:1px; color:#9FB2C8; text-decoration:none; padding:8px 14px; border-radius:8px; transition:all .15s ease; }
  .ik-nav-links a:hover{ color:var(--brass); background:rgba(255,255,255,0.06); }
  .nav-user{ font-family:var(--font-mono); font-size:12px; font-weight:500; color:var(--brass); margin-right:8px; }
  .signout-btn{ font-family:var(--font-mono); font-size:11px; color:#C3D1E0; background:none; border:1px solid rgba(255,255,255,0.22); padding:6px 14px; border-radius:8px; cursor:pointer; transition:all .15s; text-transform:uppercase; letter-spacing:0.5px; }
  .signout-btn:hover{ border-color:var(--brass); color:var(--brass); }

  .page-head{ background:#fff; border-bottom:1px solid var(--line); padding:28px; display:flex; justify-content:space-between; align-items:flex-start; flex-wrap:wrap; gap:14px; }
  .page-head .back-link{ display:inline-block; font-family:var(--font-mono); font-size:11px; color:var(--brass); text-decoration:none; margin-bottom:12px; text-transform:uppercase; letter-spacing:0.5px; }
  .page-head .back-link:hover{ text-decoration:underline; }
  .page-head h2{ font-family:var(--font-display); font-weight:400; font-size:38px; color:var(--navy); margin:0 0 8px; letter-spacing:-0.5px; }
  .page-head p{ font-size:14px; color:var(--slate); margin:0; max-width:520px; line-height:1.6; }
  .who{ font-family:var(--font-mono); font-size:12px; color:var(--slate); text-align:right; }
  .who button{ display:block; margin-top:8px; background:none; border:1px solid var(--line); color:var(--slate); font-family:var(--font-mono); font-size:11px; padding:6px 12px; border-radius:8px; cursor:pointer; text-transform:uppercase; letter-spacing:0.5px; }
  .who button:hover{ border-color:var(--brass); color:var(--brass); }

  section{ padding:36px 28px; max-width:900px; margin:0 auto; }

  .form-card{ background:#fff; border:1px solid var(--line); border-radius:var(--radius); padding:26px; margin-bottom:36px; box-shadow:var(--shadow-sm); }
  .form-card h3{ font-family:var(--font-display); font-weight:400; font-size:22px; margin:0 0 18px; color:var(--navy); }
  .field{ display:flex; flex-direction:column; gap:6px; margin-bottom:14px; }
  .field label{ font-family:var(--font-mono); font-size:10.5px; text-transform:uppercase; letter-spacing:0.8px; color:var(--ink-soft); }
  .field input, .field textarea{
    font-family:var(--font-body); font-size:14px; background:var(--paper);
    border:1px solid var(--line); border-radius:8px; padding:11px 14px; color:var(--ink); outline:none; resize:vertical;
  }
  .field input:focus-visible, .field textarea:focus-visible{ outline:2px solid var(--brass); outline-offset:1px; }
  .go-btn{
    font-family:var(--font-mono); font-weight:500; font-size:13px; text-transform:uppercase; letter-spacing:0.5px;
    background:var(--navy); color:#fff; border:none; border-radius:8px; padding:12px 24px; cursor:pointer;
    transition:all .15s ease; box-shadow:0 2px 8px rgba(12,36,56,0.2);
  }
  .go-btn:hover{ background:var(--navy-2); transform:translateY(-1px); }
  .go-btn:active{ transform:translateY(0); }
  .go-btn:disabled{ opacity:0.6; cursor:not-allowed; }
  .note{ margin-top:14px; font-family:var(--font-mono); font-size:12px; display:none; line-height:1.6; }
  .note.show{ display:block; }
  .note.error{ color:var(--red); }
  .note.success{ color:var(--green); }

  h3.list-title{ font-family:var(--font-display); font-weight:400; font-size:22px; margin:0 0 14px; color:var(--navy); }
  .coverage{ background:#fff; border:1px solid var(--line); border-radius:var(--radius); overflow:hidden; box-shadow:var(--shadow-sm); }
  table{ width:100%; border-collapse:collapse; }
  th{ text-align:left; padding:12px 16px; background:var(--navy); color:#EAF0F6; font-family:var(--font-mono); font-size:10.5px; font-weight:500; text-transform:uppercase; letter-spacing:0.6px; border-bottom:none; }
  td{ padding:13px 16px; border-bottom:1px solid var(--paper-2); font-size:13px; color:var(--slate); }
  tr:last-child td{ border-bottom:none; }
  .empty{ padding:24px 16px; color:var(--ink-faint); font-size:13px; font-family:var(--font-mono); }
  .badge{ display:inline-block; font-family:var(--font-mono); font-size:10.5px; font-weight:500; padding:3px 9px; border-radius:20px; }
  .badge.pending{ background:var(--warn-bg); color:var(--warn); }
  .badge.approved{ background:var(--ok-bg); color:var(--ok); }
  .badge.rejected{ background:var(--bad-bg); color:var(--bad); }
  .sap-note{ font-family:var(--font-mono); font-size:11px; color:var(--ink-faint); margin-top:2px; }

  footer{ background:var(--navy); color:#9FB2C8; padding:22px 28px; font-family:var(--font-mono); font-size:11px; }
  .footer-inner{ max-width:1200px; margin:0 auto; display:flex; justify-content:space-between; flex-wrap:wrap; gap:8px; align-items:center; }
  .footer-brand{ font-family:var(--font-display); font-weight:500; font-size:16px; color:#F2F5F8; }
  .footer-brand .footer-aegis{ color:#F2F5F8; }

  @media (max-width:640px){
    .corp-bar-inner{ padding:0 16px; } .corp-tag{ display:none; }
    .ik-nav{ padding:0 16px; }
    .ik-nav-inner{ height:auto; flex-direction:column; padding:12px 0; gap:10px; }
    .ik-nav-links{ flex-wrap:wrap; justify-content:center; }
    .page-head{ padding:22px 16px 24px; } .page-head h2{ font-size:28px; }
    section{ padding:28px 16px; }
  }
</style>
</head>
<body>

<div class="corp-bar">
  <div class="corp-bar-inner">
    <span class="corp-wordmark"><span class="info">Info</span><span class="krafts">Krafts</span></span>
    <span class="corp-tag">Trust • Quality • Performance</span>
  </div>
</div>

<nav class="ik-nav">
  <div class="ik-nav-inner">
    <a href="index.html" class="ik-brand">IK<span class="deg">°</span><span class="name">Kontrol</span></a>
    <div class="ik-nav-links">
      <a href="index.html">Dashboard</a>
      <span class="nav-user" id="navUser"></span>
      <button class="signout-btn" onclick="fetch('/api/logout',{method:'POST'}).then(()=>location.href='login.html')">Sign out</button>
    </div>
  </div>
</nav>

<div class="page-head">
  <div>
    <a href="index.html" class="back-link">← Back to dashboard</a>
    <h2>New Access Request</h2>
    <p>Submit a role-assignment request for approval before it reaches SAP.</p>
  </div>
  <div class="who">
    <span id="whoName">—</span>
    <button onclick="logout()">Sign out</button>
  </div>
</div>

<section>
  <div class="form-card">
    <h3>Request a role</h3>
    <form id="reqForm">
      <div class="field">
        <label for="sapUsername">SAP username</label>
        <input type="text" id="sapUsername" required placeholder="">
      </div>
      <div class="field">
        <label for="roleName">Role / AGR name</label>
        <input type="text" id="roleName" required placeholder="">
      </div>
      <div class="field">
        <label for="reason">Business reason</label>
        <textarea id="reason" rows="3" placeholder="Why does this user need this role?"></textarea>
      </div>
      <button type="submit" class="go-btn" id="submitBtn">Submit request</button>
      <div class="note" id="reqNote"></div>
    </form>
  </div>

  <h3 class="list-title">My requests</h3>
  <div class="coverage">
    <table>
      <thead><tr><th>SAP user</th><th>Role</th><th>Status</th><th>Submitted</th></tr></thead>
      <tbody id="reqBody"></tbody>
    </table>
    <div class="empty" id="emptyMsg" style="display:none;">No requests yet.</div>
  </div>
</section>

<script src="auth-guard.js"></script>
<script>
// window.REQUIRED_ROLE = 'requester';

document.addEventListener('auth-ready', function(e){
  document.getElementById('whoName').textContent = e.detail.displayName + ' (' + e.detail.username + ')';
  loadRequests();
});

function escapeHtml(s){
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function fmtDate(iso){
  try { return new Date(iso).toLocaleString(); } catch(e){ return iso; }
}

function loadRequests(){
  fetch('/api/approval-requests')
    .then(res => res.json())
    .then(data => {
      var list = data.requests || data;
      const body = document.getElementById('reqBody');
      const empty = document.getElementById('emptyMsg');
      if(!list.length){
        body.innerHTML = '';
        empty.style.display = 'block';
        return;
      }
      empty.style.display = 'none';
      body.innerHTML = list.map(r => {
        let sapNote = '';
        if(r.status === 'approved' && r.sapSyncStatus){
          sapNote = '<div class="sap-note">SAP sync: ' + escapeHtml(r.sapSyncStatus) + ' — ' + escapeHtml(r.sapSyncMessage || '') + '</div>';
        }
        return '<tr>' +
          '<td>' + escapeHtml(r.sapUsername?r.sapUsername:r.requestedBy) + '</td>' +
          '<td>' + escapeHtml(r.role?r.role:r.roleName) + '</td>' +
          '<td><span class="badge ' + r.status + '">' + r.status + '</span>' + sapNote + '</td>' +
          '<td>' + fmtDate(r.requestedAt) + '</td>' +
        '</tr>';
      }).join('');
    })
    .catch(() => {});
}

document.getElementById('reqForm').addEventListener('submit', function(e){
  e.preventDefault();
  const btn = document.getElementById('submitBtn');
  const note = document.getElementById('reqNote');
  note.classList.remove('show','error','success');
  btn.disabled = true;  const payload = {
    sapUsername: document.getElementById('sapUsername').value.trim(),
    roleName: document.getElementById('roleName').value.trim(),
    reason: document.getElementById('reason').value.trim()
  };

  if(payload.reason.length < 10){btn.disabled=false;note.classList.add('show','error');note.textContent='Business Reason must be at least 10 characters.';return;}

  fetch('/api/sap-user-check/'+encodeURIComponent(payload.sapUsername)).then(function(r){return r.json();}).then(function(chk){if(!chk.exists){btn.disabled=false;note.classList.add('show','error');note.textContent='SAP User '+payload.sapUsername+' not found in SAP system.';return;}fetch('/api/sap-role-check-v2/'+encodeURIComponent(payload.roleName))/* IK-COMPOSITE-CHK */.then(function(r2){return r2.json();}).then(function(rchk){if(!rchk.exists){btn.disabled=false;note.classList.add('show','error');note.textContent='Role '+payload.roleName+' not found in SAP system.';return;}fetch('/api/approval-requests',{
    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload)
  })
    .then(res => res.json().then(data => ({ ok: res.ok, data })))
    .then(({ ok, data }) => {
      btn.disabled = false;
      note.classList.add('show');
      if(!ok){
        note.classList.add('error');
        note.textContent = data.error || 'Request failed.';
        return;
      }
      note.classList.add('success');
      note.textContent = 'Request submitted — awaiting approval.';
      document.getElementById('reqForm').reset();
      loadRequests();
    })
    .catch(err => {
      btn.disabled = false;
      note.classList.add('show','error');
      note.textContent = 'Not connected — /api/approval-requests unreachable. ' + err.message;
    });
  }).catch(function(err2){btn.disabled=false;note.classList.add('show','error');note.textContent='Role check failed: '+err2.message;});
  }).catch(function(e){btn.disabled=false;note.classList.add('show','error');note.textContent='SAP check failed: '+e.message;});
});
fetch('/api/my-profile').then(r=>r.json()).then(u=>{var n=document.getElementById('navUser');if(n)n.textContent=u.displayName||u.username;}).catch(()=>{});
</script>

</body>
</html>
