<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IKAegis — New Access Request</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Righteous&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FFFFFF; --tint:#F5F7FA; --tint-2:#EDF2F8; --ink:#12181F; --ink-soft:#5A6A85; --ink-faint:#8A93A0;
    --line:#DCE5F0; --navy:#15263F; --blue:#1F497D; --red:#C33438; --amber:#C1811E; --green:#00B050;
    --font-display:'Sora',sans-serif; --font-body:'Inter',sans-serif; --font-mono:'IBM Plex Mono',monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{ background:var(--bg); color:var(--ink); font-family:var(--font-body); -webkit-font-smoothing:antialiased; }

  .page-head{ background:var(--navy); color:#EEF1F6; padding:28px; display:flex; justify-content:space-between; align-items:flex-start; flex-wrap:wrap; gap:14px; }
  .page-head h2{ font-family:var(--font-display); font-weight:700; font-size:24px; margin:0 0 6px; }
  .page-head p{ font-size:13px; color:#B9C2D6; margin:0; }
  .who{ font-family:var(--font-mono); font-size:12px; color:#B9C2D6; text-align:right; }
  .who button{
    display:block; margin-top:8px; background:none; border:1px solid rgba(255,255,255,0.25);
    color:#EEF1F6; font-family:var(--font-mono); font-size:11px; padding:6px 12px; border-radius:6px; cursor:pointer;
  }
  .who button:hover{ border-color:#fff; }

  section{ padding:36px 28px; max-width:900px; margin:0 auto; }

  .form-card{ background:var(--bg); border:1px solid var(--line); border-radius:10px; padding:26px; margin-bottom:36px; }
  .form-card h3{ font-family:var(--font-display); font-weight:700; font-size:17px; margin:0 0 18px; }
  .field{ display:flex; flex-direction:column; gap:6px; margin-bottom:14px; }
  .field label{ font-family:var(--font-mono); font-size:10.5px; text-transform:uppercase; letter-spacing:0.8px; color:var(--ink-soft); }
  .field input, .field textarea{
    font-family:var(--font-body); font-size:13.5px; background:var(--tint);
    border:1px solid var(--line); border-radius:7px; padding:10px 12px; color:var(--ink); outline:none; resize:vertical;
  }
  .field input:focus-visible, .field textarea:focus-visible{ outline:2px solid var(--blue); outline-offset:1px; }
  .go-btn{
    font-family:var(--font-display); font-weight:700; font-size:14px; background:var(--blue); color:#fff;
    border:none; border-radius:7px; padding:11px 22px; cursor:pointer;
  }
  .go-btn:hover{ background:#162F5E; }
  .go-btn:disabled{ opacity:0.6; cursor:not-allowed; }
  .note{ margin-top:14px; font-family:var(--font-mono); font-size:12px; display:none; line-height:1.6; }
  .note.show{ display:block; }
  .note.error{ color:var(--red); }
  .note.success{ color:var(--green); }

  h3.list-title{ font-family:var(--font-display); font-weight:700; font-size:17px; margin:0 0 14px; }
  .coverage{ background:var(--bg); border:1px solid var(--line); border-radius:10px; overflow:hidden; }
  table{ width:100%; border-collapse:collapse; }
  th{
    text-align:left; padding:12px 16px; background:var(--tint-2); font-family:var(--font-mono);
    font-size:10.5px; text-transform:uppercase; letter-spacing:0.6px; color:var(--ink-soft); border-bottom:1px solid var(--line);
  }
  td{ padding:12px 16px; border-bottom:1px solid var(--line); font-size:13px; }
  tr:last-child td{ border-bottom:none; }
  .empty{ padding:24px 16px; color:var(--ink-faint); font-size:13px; font-family:var(--font-mono); }
  .badge{ display:inline-block; font-family:var(--font-mono); font-size:10.5px; font-weight:600; padding:3px 9px; border-radius:20px; }
  .badge.pending{ background:#FBF1E2; color:var(--amber); }
  .badge.approved{ background:#E5F5EC; color:var(--green); }
  .badge.rejected{ background:#FBEAEA; color:var(--red); }
  .sap-note{ font-family:var(--font-mono); font-size:11px; color:var(--ink-faint); margin-top:2px; }

  /* ══════ IKAegis Enterprise Design System ══════ */
  :root{
    --bg:#FFFFFF;
    --ice-1:#F5F7FA; --ice-2:#EDF2F8; --ice-3:#DCE5F0;
    --ink:#1E2A3A; --slate:#5A6A85; --slate-light:#8A95A8;
    --navy:#15263F; --navy-corp:#1F497D; --navy-dark:#002060;
    --crimson:#C33438; --green:#00B050; --gold:#FFC000; --amber:#C1811E;
    --font-display:'Sora',sans-serif; --font-body:'Inter',sans-serif; --font-mono:'IBM Plex Mono',monospace;
    --shadow-sm:0 1px 3px rgba(21,38,63,0.06);
    --shadow-md:0 4px 16px rgba(21,38,63,0.08);
    --shadow-lg:0 12px 40px rgba(21,38,63,0.12);
    --radius:10px;
  }

  /* ── Nav Bar ── */
  .ik-nav{
    background:var(--navy); border-top:3px solid var(--gold);
    padding:0 28px; position:sticky; top:0; z-index:100;
    box-shadow:0 2px 12px rgba(21,38,63,0.25);
  }
  .ik-nav-inner{
    max-width:1200px; margin:0 auto; display:flex; align-items:center;
    justify-content:space-between; height:56px;
  }
  .ik-brand{
    font-family:var(--font-display); font-weight:800; font-size:22px;
    color:#EEF1F6; text-decoration:none; letter-spacing:-0.5px;
  }
  .ik-gold{ color:var(--gold); }
  .ik-nav-links{ display:flex; gap:6px; align-items:center; }
  .ik-nav-links a{
    font-family:var(--font-mono); font-size:11.5px; text-transform:uppercase;
    letter-spacing:1px; color:#8FA3C4; text-decoration:none;
    padding:8px 14px; border-radius:6px; transition:all .15s ease;
  }
  .ik-nav-links a:hover{ color:#fff; background:rgba(255,255,255,0.08); }
  .ik-nav-links a.active{ color:#fff; background:rgba(255,255,255,0.12); }
  .nav-user{ font-family:var(--font-body); font-size:13px; font-weight:600; color:var(--gold); margin-right:8px; }
  .signout-btn{ font-family:var(--font-mono); font-size:11px; color:#8FA3C4; background:none; border:1px solid rgba(255,255,255,0.2); padding:6px 14px; border-radius:6px; cursor:pointer; transition:all .15s; }
  .signout-btn:hover{ border-color:var(--gold); color:var(--gold); }

  /* ── Updated common elements ── */
  body{ background:var(--ice-1); color:var(--ink); }
  ::selection{ background:var(--navy-corp); color:#fff; }

  .page-head{
    background:linear-gradient(135deg, var(--navy) 0%, var(--navy-corp) 100%);
    color:#EEF1F6; padding:36px 28px 40px;
  }
  .page-head-inner{ max-width:1200px; margin:0 auto; }
  .page-head h2{
    font-family:var(--font-display); font-weight:800; font-size:28px;
    margin:0 0 8px; letter-spacing:-0.3px;
  }
  .page-head p{ font-size:14px; color:#B9C2D6; margin:0; max-width:560px; line-height:1.6; }

  section{ padding:44px 28px; }
  .section-inner{ max-width:1200px; margin:0 auto; }
  section.tint{ background:var(--ice-2); }

  .eyebrow{
    font-family:var(--font-mono); font-size:11px; letter-spacing:2.5px;
    text-transform:uppercase; color:var(--navy-corp); margin:0 0 10px; font-weight:600;
  }
  .section-title{
    font-family:var(--font-display); font-weight:800; font-size:26px;
    letter-spacing:-0.3px; margin:0 0 8px; color:var(--navy); line-height:1.25;
  }
  .section-sub{
    font-size:14px; color:var(--slate); max-width:560px; line-height:1.6; margin:0 0 28px;
  }

  /* ── Cards & Panels ── */
  .option-card{
    display:block; text-align:left; width:100%;
    background:#fff; border:1px solid var(--ice-3); border-radius:var(--radius);
    padding:24px; cursor:pointer; font-family:var(--font-body);
    box-shadow:var(--shadow-sm);
    transition:all .2s ease;
  }
  .option-card:hover{
    border-color:var(--navy-corp); box-shadow:var(--shadow-md);
    transform:translateY(-2px);
  }
  .option-card .icon{ font-size:24px; margin-bottom:14px; display:block; }
  .option-card .title{
    font-family:var(--font-display); font-weight:700; font-size:15px;
    color:var(--navy); margin-bottom:6px;
  }
  .option-card .desc{ font-size:13px; color:var(--slate); line-height:1.5; }

  .panel{
    background:#fff; border:1px solid var(--ice-3); border-radius:var(--radius);
    overflow:hidden; box-shadow:var(--shadow-sm);
  }
  .panel-head{
    padding:18px 24px; border-bottom:1px solid var(--ice-3);
    background:var(--ice-1);
  }

  /* ── Tables ── */
  table.data thead th, .coverage th{
    background:var(--navy-corp); color:#fff;
    font-family:var(--font-mono); font-size:10.5px; text-transform:uppercase;
    letter-spacing:1px; padding:12px 20px; border-bottom:none;
  }
  table.data tbody td, .coverage td{
    padding:13px 20px; border-bottom:1px solid var(--ice-3); font-size:13.5px; color:var(--slate);
  }
  table.data tbody tr:hover{ background:var(--ice-2); }

  /* ── Buttons ── */
  .go-btn{
    font-family:var(--font-display); font-weight:700; font-size:14px;
    background:var(--navy-corp); color:#fff; border:none; border-radius:8px;
    padding:12px 28px; cursor:pointer;
    transition:all .15s ease; box-shadow:0 2px 8px rgba(31,73,125,0.25);
  }
  .go-btn:hover{ background:var(--navy-dark); transform:translateY(-1px); box-shadow:0 4px 12px rgba(31,73,125,0.3); }
  .go-btn:active{ transform:translateY(0); }

  /* ── Stats ── */
  .stat-row{
    display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
    gap:16px; margin-top:12px;
  }
  .stat{
    background:#fff; border:1px solid var(--ice-3); border-radius:var(--radius);
    padding:24px; box-shadow:var(--shadow-sm);
    border-right:none;
  }
  .stat .v{
    font-family:var(--font-display); font-weight:800; font-size:42px; line-height:1;
    letter-spacing:-1px; color:var(--navy-corp);
  }
  .stat.red .v{ color:var(--crimson); }
  .stat.amber .v{ color:var(--amber); }
  .stat.green .v{ color:var(--green); }
  .stat.navy .v{ color:var(--navy-corp); }
  .stat .l{ font-size:13px; color:var(--slate); margin-top:10px; line-height:1.4; }

  /* ── Inquiry Box ── */
  .inquiry-box{
    background:#fff; border:1px solid var(--ice-3); border-radius:var(--radius);
    padding:28px; box-shadow:var(--shadow-sm);
  }
  .inquiry-row input{
    background:var(--ice-1); border:1px solid var(--ice-3); border-radius:8px;
    padding:14px 18px; font-size:14.5px;
  }
  .inquiry-row input:focus-visible{ outline:2px solid var(--navy-corp); outline-offset:1px; }

  /* ── Chips ── */
  .chip{
    background:var(--ice-1); border:1px solid var(--ice-3); border-radius:8px;
    padding:8px 16px; font-size:12.5px; color:var(--slate);
  }
  .chip:hover{ border-color:var(--navy-corp); color:var(--navy-corp); background:var(--ice-2); }

  /* ── Risk Tags & Badges ── */
  .risk-tag{
    font-family:var(--font-mono); font-size:10.5px; text-transform:uppercase;
    padding:4px 10px; border-radius:5px; font-weight:600;
  }
  .risk-tag.high, .risk-tag.HIGH{ background:#FBEAEA; color:var(--crimson); }
  .risk-tag.medium, .risk-tag.MEDIUM{ background:#FBF1E2; color:var(--amber); }
  .badge.approved{ background:#E5F5EC; color:var(--green); }
  .badge.rejected{ background:#FBEAEA; color:var(--crimson); }

  /* ── Footer ── */
  footer{
    background:var(--navy); color:#8FA3C4;
    padding:20px 28px; font-family:var(--font-mono); font-size:11px;
    border-top:2px solid var(--gold);
  }
  .footer-inner{
    max-width:1200px; margin:0 auto; display:flex; justify-content:space-between; flex-wrap:wrap; gap:8px;
  }
  .footer-brand{ font-family:var(--font-display); font-weight:700; font-size:14px; color:#EEF1F6; }
  .footer-brand .footer-aegis{ color:#EEF1F6; }
  .footer-brand .ik-gold, .footer-brand span:first-child{ color:var(--gold); }

  /* ── Form elements ── */
  .field input, .field select{
    background:var(--ice-1); border:1px solid var(--ice-3); border-radius:8px;
    padding:11px 14px; font-size:14px; color:var(--ink);
  }
  .field input:focus-visible, .field select:focus-visible{
    outline:2px solid var(--navy-corp); outline-offset:1px;
  }
  .field label{
    font-family:var(--font-mono); font-size:10.5px; text-transform:uppercase;
    letter-spacing:1px; color:var(--slate);
  }

  /* ── Coverage table ── */
  .coverage{
    background:#fff; border:1px solid var(--ice-3); border-radius:var(--radius);
    overflow:hidden; box-shadow:var(--shadow-sm);
  }

  /* ── Back links ── */
  .back-link{
    font-family:var(--font-mono); font-size:12px; color:#B9C2D6;
    text-decoration:none; margin-bottom:14px; cursor:pointer; background:none; border:none; padding:0;
  }
  .back-link:hover{ color:var(--gold); }

  /* ── Flags ── */
  .flag.live{ background:#E5F5EC; color:var(--green); }
  .flag.pending{ background:#FBF1E2; color:var(--amber); }

  /* ── Approve/Reject buttons ── */
  .btn.approve{ background:var(--green); color:#fff; border-radius:8px; }
  .btn.approve:hover{ background:#009040; }
  .btn.reject{ background:var(--ice-1); color:var(--crimson); border:1px solid var(--ice-3); border-radius:8px; }
  .btn.reject:hover{ background:#FBEAEA; }

  /* ── Request cards ── */
  .req-card{
    background:#fff; border:1px solid var(--ice-3); border-radius:var(--radius);
    padding:20px 24px; box-shadow:var(--shadow-sm);
  }

  /* ── Empty states ── */
  .empty{ background:var(--ice-1); border:1px solid var(--ice-3); border-radius:var(--radius); color:var(--slate); }
  .empty-panel p{ color:var(--slate); }

  /* ── Mobile ── */
  @media (max-width:640px){
    .ik-nav-inner{ height:auto; flex-direction:column; padding:12px 0; gap:10px; }
    .ik-nav-links{ flex-wrap:wrap; justify-content:center; }
    .stat-row{ grid-template-columns:1fr; }
    .option-grid{ grid-template-columns:1fr; }
  }

</style>
</head>
<body>
<nav class="ik-nav">
  <div class="ik-nav-inner">
    <a href="index.html" class="ik-brand"><span class="ik-gold">IK</span>Aegis</a>
    <div class="ik-nav-links">
      <span class="nav-user" id="navUser"></span>
      <button class="signout-btn" onclick="fetch('/api/logout',{method:'POST'}).then(()=>location.href='login.html')">SIGN OUT</button>
    </div>
  </div>
</nav>


<div class="page-head">
  <div>
    <a href="index.html" style="display:inline-block; font-family:var(--font-mono); font-size:12px; color:#B9C2D6; text-decoration:none; margin-bottom:14px;">← Back to dashboard</a>
    <h2>New Access Request</h2>
    <p>Submit a role-assignment request for approval before it reaches SAP.</p>
  </div>
  <div class="who">
    <span id="whoName">—</span>
    <button onclick="logout()">Sign out</button>
  </div>
</div>

<section>
  <div class="form-card">
    <h3>Request a role</h3>
    <form id="reqForm">
      <div class="field">
        <label for="sapUsername">SAP username</label>
        <input type="text" id="sapUsername" required placeholder="e.g. JSMITH">
      </div>
      <div class="field">
        <label for="roleName">Role / AGR name</label>
        <input type="text" id="roleName" required placeholder="e.g. Z_FI_ANALYST">
      </div>
      <div class="field">
        <label for="reason">Business reason</label>
        <textarea id="reason" rows="3" placeholder="Why does this user need this role?"></textarea>
      </div>
      <button type="submit" class="go-btn" id="submitBtn">Submit request</button>
      <div class="note" id="reqNote"></div>
    </form>
  </div>

  <h3 class="list-title">My requests</h3>
  <div class="coverage">
    <table>
      <thead><tr><th>SAP user</th><th>Role</th><th>Status</th><th>Submitted</th></tr></thead>
      <tbody id="reqBody"></tbody>
    </table>
    <div class="empty" id="emptyMsg" style="display:none;">No requests yet.</div>
  </div>
</section>

<script src="auth-guard.js"></script>
<script>
// window.REQUIRED_ROLE = 'requester';

document.addEventListener('auth-ready', function(e){
  document.getElementById('whoName').textContent = e.detail.displayName + ' (' + e.detail.username + ')';
  loadRequests();
});

function escapeHtml(s){
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function fmtDate(iso){
  try { return new Date(iso).toLocaleString(); } catch(e){ return iso; }
}

function loadRequests(){
  fetch('/api/approval-requests')
    .then(res => res.json())
    .then(data => {
      var list = data.requests || data;
      const body = document.getElementById('reqBody');
      const empty = document.getElementById('emptyMsg');
      if(!list.length){
        body.innerHTML = '';
        empty.style.display = 'block';
        return;
      }
      empty.style.display = 'none';
      body.innerHTML = list.map(r => {
        let sapNote = '';
        if(r.status === 'approved' && r.sapSyncStatus){
          sapNote = '<div class="sap-note">SAP sync: ' + escapeHtml(r.sapSyncStatus) + ' — ' + escapeHtml(r.sapSyncMessage || '') + '</div>';
        }
        return '<tr>' +
          '<td>' + escapeHtml(r.sapUsername?r.sapUsername:r.requestedBy) + '</td>' +
          '<td>' + escapeHtml(r.role?r.role:r.roleName) + '</td>' +
          '<td><span class="badge ' + r.status + '">' + r.status + '</span>' + sapNote + '</td>' +
          '<td>' + fmtDate(r.requestedAt) + '</td>' +
        '</tr>';
      }).join('');
    })
    .catch(() => {});
}

document.getElementById('reqForm').addEventListener('submit', function(e){
  e.preventDefault();
  const btn = document.getElementById('submitBtn');
  const note = document.getElementById('reqNote');
  note.classList.remove('show','error','success');
  btn.disabled = true;  const payload = {
    sapUsername: document.getElementById('sapUsername').value.trim(),
    roleName: document.getElementById('roleName').value.trim(),
    reason: document.getElementById('reason').value.trim()
  };

  if(payload.reason.length < 10){btn.disabled=false;note.classList.add('show','error');note.textContent='Business Reason must be at least 10 characters.';return;}

  fetch('/api/sap-user-check/'+encodeURIComponent(payload.sapUsername)).then(function(r){return r.json();}).then(function(chk){if(!chk.exists){btn.disabled=false;note.classList.add('show','error');note.textContent='SAP User '+payload.sapUsername+' not found in SAP system.';return;}fetch('/api/sap-role-check/'+encodeURIComponent(payload.roleName)).then(function(r2){return r2.json();}).then(function(rchk){if(!rchk.exists){btn.disabled=false;note.classList.add('show','error');note.textContent='Role '+payload.roleName+' not found in SAP system.';return;}fetch('/api/approval-requests',{
    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload)
  })
    .then(res => res.json().then(data => ({ ok: res.ok, data })))
    .then(({ ok, data }) => {
      btn.disabled = false;
      note.classList.add('show');
      if(!ok){
        note.classList.add('error');
        note.textContent = data.error || 'Request failed.';
        return;
      }
      note.classList.add('success');
      note.textContent = 'Request submitted — awaiting approval.';
      document.getElementById('reqForm').reset();
      loadRequests();
    })
    .catch(err => {
      btn.disabled = false;
      note.classList.add('show','error');
      note.textContent = 'Not connected — /api/approval-requests unreachable. ' + err.message;
    });
  }).catch(function(err2){btn.disabled=false;note.classList.add('show','error');note.textContent='Role check failed: '+err2.message;});
  }).catch(function(e){btn.disabled=false;note.classList.add('show','error');note.textContent='SAP check failed: '+e.message;});
});
fetch('/api/my-profile').then(r=>r.json()).then(u=>{var n=document.getElementById('navUser');if(n)n.textContent=u.displayName||u.username;}).catch(()=>{});
</script>

</body>
</html>
