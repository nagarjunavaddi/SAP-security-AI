<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Role SoD Risk Analysis — IK° Kontrol</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FFFFFF;
    --ice-1:#F5F7FA; --ice-2:#EDF2F8; --ice-3:#DCE5F0;
    --ink:#12181F; --slate:#5A6A85; --slate-light:#8A93A0;
    --navy:#0C2438; --navy-corp:#1F497D; --navy-2:#123252;
    --crimson:#C33438; --green:#00B050; --brass:#B0894F; --amber:#C1811E;
    --font-display:'Fraunces',serif; --font-body:'Inter',sans-serif; --font-mono:'IBM Plex Mono',monospace;
    --shadow-sm:0 1px 3px rgba(12,36,56,0.06);
    --shadow-md:0 4px 16px rgba(12,36,56,0.08);
    --radius:10px;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body {
    background: var(--ice-1);
    color: var(--ink);
    font-family: var(--font-body);
    -webkit-font-smoothing:antialiased;
  }
  ::selection{ background:var(--navy); color:#fff; }

  /* ====== Corp bar ====== */
  .corp-bar{ background:#081A2A; height:32px; display:flex; align-items:center; padding:0 28px; }
  .corp-bar-inner{ max-width:1200px; width:100%; margin:0 auto; display:flex; justify-content:space-between; align-items:center; }
  .corp-name{ font-family:var(--font-mono); font-size:11px; letter-spacing:1px; color:#8FA3C4; text-transform:uppercase; }
  .corp-tag{ font-family:var(--font-mono); font-size:10px; letter-spacing:2px; color:#5C7392; text-transform:uppercase; }

  /* ── Nav Bar ── */
  .ik-nav{
    background:var(--navy);
    padding:0 28px; position:sticky; top:0; z-index:100;
    box-shadow:0 2px 12px rgba(12,36,56,0.25);
  }
  .ik-nav-inner{
    max-width:1200px; margin:0 auto; display:flex; align-items:center;
    justify-content:space-between; height:52px;
  }
  .ik-brand{
    font-family:var(--font-display); font-weight:700; font-size:22px;
    color:#fff; text-decoration:none; letter-spacing:0.2px;
  }
  .ik-gold{ color:var(--brass); }
  .ik-nav-links{ display:flex; gap:6px; align-items:center; }
  .nav-user{ font-family:var(--font-mono); font-size:12px; color:#B9C2D6; margin-right:8px; }
  .signout-btn{ font-family:var(--font-mono); font-size:11px; color:#8FA3C4; background:none; border:1px solid rgba(255,255,255,0.2); padding:6px 14px; border-radius:6px; cursor:pointer; transition:all .15s; }
  .signout-btn:hover{ border-color:var(--brass); color:var(--brass); }

  /* ── Page head ── */
  .page-head{
    background:var(--navy);
    color:#EEF1F6; padding:28px 28px;
  }
  .page-head-inner{ max-width:1200px; margin:0 auto; }
  .back-link{
    display:inline-flex; align-items:center; gap:6px;
    font-family:var(--font-mono); font-size:12px; color:#B9C2D6;
    text-decoration:none; margin-bottom:14px; cursor:pointer; background:none; border:none; padding:0;
  }
  .back-link:hover{ color:#fff; }
  .page-head h2{
    font-family:var(--font-display); font-weight:700; font-size:30px;
    margin:0 0 6px; letter-spacing:0.2px;
  }
  .page-head p{ font-size:13.5px; color:#B9C2D6; margin:0; max-width:560px; line-height:1.5; }

  .container {
    max-width: 1000px;
    margin: 36px auto;
    padding: 0 20px;
  }

  /* ── Search box (light) ── */
  .search-box {
    background: #fff;
    border: 1px solid var(--ice-3);
    border-radius: var(--radius);
    padding: 24px;
    display: flex;
    gap: 12px;
    align-items: center;
    box-shadow: var(--shadow-sm);
  }
  .search-box input {
    flex: 1;
    background: var(--ice-1);
    border: 1px solid var(--ice-3);
    border-radius: 7px;
    padding: 13px 16px;
    color: var(--ink);
    font-family: var(--font-body);
    font-size: 14.5px;
    outline: none;
  }
  .search-box input:focus-visible { outline: 2px solid var(--brass); outline-offset: 1px; }
  .search-box input::placeholder { color: var(--slate-light); }
  .search-box button {
    background: var(--navy);
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 13px 28px;
    font-family: var(--font-display);
    font-weight: 600;
    cursor: pointer;
    font-size: 14px;
    transition: all .15s;
  }
  .search-box button:hover { background: var(--navy-2); }
  .search-box button:disabled { background: var(--ice-3); color: var(--slate-light); cursor: not-allowed; }

  /* ── Summary (light) ── */
  .summary {
    margin-top: 24px;
    display: flex;
    gap: 16px;
  }
  .summary-card {
    flex: 1;
    background: #fff;
    border: 1px solid var(--ice-3);
    border-radius: var(--radius);
    padding: 22px;
    text-align: center;
    box-shadow: var(--shadow-sm);
  }
  .summary-card .num { font-family: var(--font-display); font-size: 36px; font-weight: 700; color: var(--navy); }
  .summary-card .label { font-family: var(--font-mono); font-size: 10.5px; letter-spacing: 0.8px; color: var(--slate); margin-top: 6px; }
  .summary-card.critical .num { color: var(--crimson); }

  /* ── Violations (light) ── */
  .violations { margin-top: 24px; }
  .violation-card {
    background: #fff;
    border: 1px solid var(--ice-3);
    border-left: 4px solid var(--crimson);
    border-radius: var(--radius);
    padding: 18px 20px;
    margin-bottom: 14px;
    box-shadow: var(--shadow-sm);
  }
  .violation-card.medium { border-left-color: var(--amber); }
  .violation-card.low { border-left-color: var(--brass); }
  .violation-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .violation-header .risk-id { font-family: var(--font-mono); color: var(--slate); font-size: 12px; }
  .violation-header .risk-name { font-family: var(--font-display); font-weight: 700; color: var(--ink); font-size: 16px; margin-top: 2px; }
  .badge {
    font-family: var(--font-mono);
    font-size: 10px;
    font-weight: 600;
    padding: 4px 10px;
    border-radius: 12px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .badge.critical { background: #FBEAEA; color: var(--crimson); }
  .badge.high { background: #FBEAEA; color: var(--crimson); }
  .badge.medium { background: #FBF1E2; color: var(--amber); }
  .badge.low { background: #E5F5EC; color: var(--green); }

  .function-row {
    margin-top: 12px;
    padding-top: 12px;
    border-top: 1px solid var(--ice-3);
    font-size: 13px;
    color: var(--slate);
  }
  .function-row b { color: var(--ink); }
  .tcode-chip {
    display: inline-block;
    background: var(--ice-2);
    border: 1px solid var(--ice-3);
    border-radius: 4px;
    padding: 2px 8px;
    margin: 3px 4px 0 0;
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--navy);
  }

  .empty-state {
    text-align: center;
    color: var(--slate-light);
    padding: 60px 20px;
    font-size: 14px;
  }
  .loading { text-align: center; font-family: var(--font-mono); color: var(--navy-corp); padding: 40px; font-size: 13px; }
  .error-box {
    background: #FFF0F0;
    border: 1px solid #FFCDD2;
    color: var(--crimson);
    border-radius: 8px;
    padding: 14px 18px;
    margin-top: 20px;
    font-size: 13px;
  }
  .clean-box {
    background: #F0FFF4;
    border: 1px solid #C8E6C9;
    color: #2E7D32;
    border-radius: 8px;
    padding: 18px;
    margin-top: 24px;
    text-align: center;
    font-size: 13px;
  }

  /* ── Footer ── */
  footer{
    background:var(--navy); color:#8FA3C4;
    padding:20px 28px; font-family:var(--font-mono); font-size:11px;
  }
  .footer-inner{
    max-width:1200px; margin:0 auto; display:flex; justify-content:space-between; flex-wrap:wrap; gap:8px;
  }
  .footer-brand{ font-family:var(--font-display); font-weight:700; font-size:14px; color:#EEF1F6; }
  .footer-brand .footer-aegis{ color:#EEF1F6; }
  .footer-brand .ik-gold{ color:var(--brass); }

  /* ── Mobile ── */
  @media (max-width:640px){
    .ik-nav-inner{ height:auto; flex-direction:column; padding:12px 0; gap:10px; }
    .ik-nav-links{ flex-wrap:wrap; justify-content:center; }
    .summary{ flex-direction:column; }
    .search-box{ flex-direction:column; align-items:stretch; }
  }
</style>
</head>
<body>
<div class="corp-bar">
  <div class="corp-bar-inner">
    <span class="corp-name">InfoKrafts</span>
    <span class="corp-tag">Trust &middot; Quality &middot; Performance</span>
  </div>
</div>
<nav class="ik-nav">
  <div class="ik-nav-inner">
    <a href="index.html" class="ik-brand">IK<span class="ik-gold">°</span> Kontrol</a>
    <div class="ik-nav-links">
      <span class="nav-user" id="navUser"></span>
      <button class="signout-btn" onclick="fetch('/api/logout',{method:'POST'}).then(()=>location.href='login.html')">SIGN OUT</button>
    </div>
  </div>
</nav>

<div class="page-head">
  <div class="page-head-inner">
    <a class="back-link" href="index.html">&#8592; Back to dashboard</a>
    <h2>Role SoD Risk Analysis</h2>
    <p>Segregation of Duties check — role-level, T-code based</p>
  </div>
</div>

<div class="container">

  <div class="search-box">
    <input type="text" id="roleNameInput" placeholder="Enter SAP Role Name (e.g. Z_AP_ACCOUNTANT)" />
    <button id="analyzeBtn" onclick="runAnalysis()">Analyze</button>
  </div>

  <div id="resultArea"></div>

</div>

<script>
async function runAnalysis() {
  const roleName = document.getElementById('roleNameInput').value.trim();
  const resultArea = document.getElementById('resultArea');
  const btn = document.getElementById('analyzeBtn');

  if (!roleName) {
    resultArea.innerHTML = '<div class="error-box">Please enter a role name.</div>';
    return;
  }

  btn.disabled = true;
  btn.textContent = 'Analyzing...';
  resultArea.innerHTML = '<div class="loading">Fetching role T-codes from SAP and checking against ruleset...</div>';

  try {
    const res = await fetch(`/api/risk-analysis/role/${encodeURIComponent(roleName)}`);
    const data = await res.json();

    if (!res.ok) {
      resultArea.innerHTML = `<div class="error-box">${data.error || 'Analysis failed.'}</div>`;
      return;
    }

    if (data.tcodeCount === 0) {
      resultArea.innerHTML = `<div class="error-box">No T-codes found for role "${roleName}". Check the role name and try again.</div>`;
      return;
    }

    let html = `
      <div class="summary">
        <div class="summary-card">
          <div class="num">${data.tcodeCount}</div>
          <div class="label">T-CODES IN ROLE</div>
        </div>
        <div class="summary-card ${data.violationCount > 0 ? 'critical' : ''}">
          <div class="num">${data.violationCount}</div>
          <div class="label">SoD VIOLATIONS FOUND</div>
        </div>
      </div>
    `;

    if (data.violationCount === 0) {
      html += `<div class="clean-box">✅ No Segregation of Duties conflicts found for role "${roleName}".</div>`;
    } else {
      html += '<div class="violations">';
      for (const v of data.violations) {
        const levelClass = (v.riskLevel || '').toLowerCase();
        html += `
          <div class="violation-card ${levelClass}">
            <div class="violation-header">
              <div>
                <div class="risk-id">${v.riskId} &middot; ${v.businessProcess || ''}</div>
                <div class="risk-name">${v.riskName}</div>
              </div>
              <span class="badge ${levelClass}">${v.riskLevel || 'N/A'}</span>
            </div>
        `;
        for (const f of v.matchedFunctions) {
          html += `
            <div class="function-row">
              <b>${f.functionId}</b> — ${f.functionDescription}<br/>
              ${f.matchedTcodes.map(tc => `<span class="tcode-chip">${tc}</span>`).join('')}
            </div>
          `;
        }
        html += '</div>';
      }
      html += '</div>';
    }

    resultArea.innerHTML = html;

  } catch (e) {
    resultArea.innerHTML = `<div class="error-box">Error: ${e.message}</div>`;
  } finally {
    btn.disabled = false;
    btn.textContent = 'Analyze';
  }
}

document.getElementById('roleNameInput').addEventListener('keypress', (e) => {
  if (e.key === 'Enter') runAnalysis();
});
fetch('/api/my-profile').then(r=>r.json()).then(u=>{var n=document.getElementById('navUser');if(n)n.textContent=u.displayName||u.username;}).catch(()=>{});
</script>

</body>
</html>
