<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Access Requests - IK° Kontrol</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;450;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#0C2438; --navy-2:#14344F;
    --ink:#1B2A38; --slate:#5E7186; --slate-light:#8A99A8;
    --line:#E4E9EC; --paper:#FAFBFC; --paper-2:#F1F4F6; --card:#FFFFFF;
    --brass:#B0894F; --blue:#2563A8;
    --green:#1E7A46; --green-bg:#E4F3EA;
    --red:#B23A3A; --red-bg:#F8E7E7;
    --amber:#9A6B1E; --amber-bg:#FBF1DF;
    --font-display:'Fraunces',serif; --font-body:'Inter',sans-serif; --font-mono:'IBM Plex Mono',monospace;
    --radius:14px; --shadow:0 1px 2px rgba(12,36,56,0.05), 0 8px 24px rgba(12,36,56,0.06);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{ background:var(--paper); color:var(--ink); font-family:var(--font-body); -webkit-font-smoothing:antialiased; line-height:1.5; }
  ::selection{ background:var(--navy); color:#fff; }

  .corp-bar{ background:#fff; border-bottom:1px solid var(--line); padding:0 40px; }
  .corp-inner{ max-width:1120px; margin:0 auto; height:50px; display:flex; align-items:center; justify-content:space-between; }
  .logo-fallback{ font-weight:700; font-size:16px; color:var(--navy); letter-spacing:-0.3px; }
  .logo-fallback .k{ color:var(--blue); }
  .corp-values{ display:flex; align-items:center; gap:14px; }
  .corp-values span{ font-family:var(--font-mono); font-size:11px; letter-spacing:2.5px; text-transform:uppercase; color:var(--brass); }
  .corp-values .cv-dot{ width:3px; height:3px; border-radius:50%; background:var(--brass); }

  .nav{ background:var(--navy); padding:0 40px; position:sticky; top:0; z-index:100; }
  .nav-inner{ max-width:1120px; margin:0 auto; display:flex; align-items:center; justify-content:space-between; height:62px; }
  .brand{ font-family:var(--font-display); font-weight:500; font-size:21px; color:#fff; text-decoration:none; letter-spacing:0.3px; display:flex; align-items:baseline; gap:1px; }
  .brand .deg{ color:var(--brass); font-size:15px; position:relative; top:-3px; margin:0 1px; }
  .brand .name{ font-weight:400; letter-spacing:0.8px; }
  .nav-right{ display:flex; align-items:center; gap:20px; }
  .nav-links a{ font-family:var(--font-mono); font-size:12px; color:#B4C3D2; text-decoration:none; letter-spacing:0.3px; }
  .nav-links a:hover{ color:var(--brass); }
  .nav-user{ font-family:var(--font-mono); font-size:12px; color:#B4C3D2; }
  .nav-signout{ font-family:var(--font-mono); font-size:11px; color:#B4C3D2; background:none; border:1px solid rgba(255,255,255,0.22); padding:7px 15px; border-radius:7px; cursor:pointer; }
  .nav-signout:hover{ border-color:var(--brass); color:var(--brass); }

  .head{ max-width:1120px; margin:0 auto; padding:44px 40px 8px; }
  .eyebrow{ font-family:var(--font-mono); font-size:11px; letter-spacing:2.5px; text-transform:uppercase; color:var(--brass); margin-bottom:14px; }
  .head h1{ font-family:var(--font-display); font-weight:400; font-size:38px; line-height:1.08; color:var(--navy); letter-spacing:-0.8px; }
  .head .back{ color:var(--slate); font-family:var(--font-mono); font-size:12px; text-decoration:none; display:inline-block; margin-bottom:14px; }
  .head .back:hover{ color:var(--brass); }

  .main{ max-width:1120px; margin:0 auto; padding:24px 40px 80px; }

  .hub-grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(260px, 1fr)); gap:16px; }
  .hub-card{ background:var(--card); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); padding:24px; text-decoration:none; color:inherit; display:flex; align-items:center; gap:16px; transition:box-shadow .15s, transform .15s, border-color .15s; position:relative; }
  .hub-card:hover{ box-shadow:0 12px 32px rgba(12,36,56,0.10); transform:translateY(-2px); border-color:var(--brass); }
  .hub-card.gated{ display:none; }
  .hub-icon{ width:46px; height:46px; border-radius:12px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .hub-title{ font-family:var(--font-display); font-weight:500; font-size:17px; color:var(--navy); }
  .hub-badge{ position:absolute; top:14px; right:14px; background:var(--red); color:#fff; font-family:var(--font-mono); font-weight:600; font-size:11px; min-width:22px; height:22px; border-radius:11px; display:none; align-items:center; justify-content:center; padding:0 6px; }

  .notice{ background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:40px; text-align:center; box-shadow:var(--shadow); color:var(--slate); font-size:14px; }
  .notice a{ color:var(--blue); font-weight:600; text-decoration:none; }
</style>
</head>
<body>

  <div class="corp-bar">
    <div class="corp-inner">
      <div class="logo-fallback">Info<span class="k">Krafts</span></div>
      <div class="corp-values">
        <span>Trust</span><span class="cv-dot"></span>
        <span>Quality</span><span class="cv-dot"></span>
        <span>Performance</span>
      </div>
    </div>
  </div>

  <nav class="nav">
    <div class="nav-inner">
      <a href="index.html" class="brand">IK<span class="deg">&#176;</span><span class="name">Kontrol</span></a>
      <div class="nav-right">
        <div class="nav-links"><a href="index.html">Dashboard</a></div>
        <span class="nav-user" id="navUser"></span>
        <button class="nav-signout" onclick="signOut()">Sign out</button>
      </div>
    </div>
  </nav>

  <div class="head">
    <a href="index.html" class="back">&larr; Dashboard</a>
    <div class="eyebrow">Access Requests</div>
    <h1>Requests</h1>
  </div>

  <div class="main">
    <div class="hub-grid" id="hubGrid">

      <a class="hub-card" href="new-request.html">
        <div class="hub-icon" style="background:var(--amber-bg);">
          <svg width="24" height="24" fill="none" stroke="#9A6B1E" stroke-width="2" stroke-linecap="round"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><path d="M14 2v6h6M16 13H8M16 17H8M10 9H8"/></svg>
        </div>
        <div class="hub-title">New Request</div>
      </a>

      <a class="hub-card" id="hubCreateUser" data-role="admin" href="create-user.html">
        <div class="hub-icon" style="background:var(--green-bg);">
          <svg width="24" height="24" fill="none" stroke="#1E7A46" stroke-width="2" stroke-linecap="round"><path d="M16 18v-2a4 4 0 00-8 0v2"/><circle cx="12" cy="7" r="4"/><path d="M19 8v6M22 11h-6"/></svg>
        </div>
        <div class="hub-title">Create User</div>
      </a>

      <a class="hub-card" href="user-lock-request.html">
        <div class="hub-icon" style="background:var(--paper-2);">
          <svg width="24" height="24" fill="none" stroke="#2563A8" stroke-width="2" stroke-linecap="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        </div>
        <div class="hub-title">User Lock</div>
      </a>

      <a class="hub-card" id="hubInbox" data-role="approver" href="approvals.html">
        <div class="hub-icon" style="background:var(--red-bg);">
          <svg width="24" height="24" fill="none" stroke="#B23A3A" stroke-width="2" stroke-linecap="round"><path d="M22 12h-6l-2 3H10l-2-3H2"/><path d="M5.45 5.11L2 12v6a2 2 0 002 2h16a2 2 0 002-2v-6l-3.45-6.89A2 2 0 0016.76 4H7.24a2 2 0 00-1.79 1.11z"/></svg>
        </div>
        <div class="hub-title">Approval Inbox</div>
        <span class="hub-badge" id="hubInboxBadge">0</span>
      </a>

      <a class="hub-card" id="hubConfig" data-role="admin" href="approval-config.html">
        <div class="hub-icon" style="background:var(--paper-2);">
          <svg width="24" height="24" fill="none" stroke="#2563A8" stroke-width="2" stroke-linecap="round"><path d="M12 15a3 3 0 100-6 3 3 0 000 6z"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 01-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
        </div>
        <div class="hub-title">Approval Config</div>
      </a>

    </div>
  </div>

<script>
  (function(){
    fetch('/api/my-profile')
      .then(function(r){ if(!r.ok) throw new Error('401'); return r.json(); })
      .then(function(p){
        var nu=document.getElementById('navUser');
        if(nu && p && p.displayName) nu.textContent=p.displayName;
        var role=p.role;
        var isAdmin = role==='admin';
        var isApprover = (role==='admin' || role==='manager' || role==='role_owner');
        if(!isAdmin){
          var cu=document.getElementById('hubCreateUser'); if(cu) cu.classList.add('gated');
          var cf=document.getElementById('hubConfig');     if(cf) cf.classList.add('gated');
        }
        if(!isApprover){
          var ib=document.getElementById('hubInbox'); if(ib) ib.classList.add('gated');
        } else {
          fetch('/api/approval-stats').then(function(r){ return r.json(); }).then(function(d){
            if(d && d.pending>0){
              var b=document.getElementById('hubInboxBadge');
              b.textContent=d.pending;
              b.style.display='flex';
            }
          }).catch(function(){});
        }
      })
      .catch(function(){
        document.querySelector('.main').innerHTML='<div class="notice">Please <a href="login.html">sign in</a> to view Access Requests.</div>';
      });
  })();

  function signOut(){
    fetch('/api/logout',{method:'POST'}).finally(function(){ window.location.href='login.html'; });
  }
</script>
</body>
</html>
