<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Access Requests - IKAegis</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FFFFFF;
    --ice-1:#F5F7FA; --ice-2:#EDF2F8; --ice-3:#DCE5F0;
    --ink:#1E2A3A; --slate:#5A6A85; --slate-light:#8A95A8;
    --navy:#15263F; --navy-corp:#1F497D; --navy-dark:#002060;
    --crimson:#C33438; --green:#00B050; --gold:#FFC000; --amber:#C1811E;
    --font-display:'Sora',sans-serif; --font-body:'Inter',sans-serif; --font-mono:'IBM Plex Mono',monospace;
    --shadow-sm:0 1px 3px rgba(21,38,63,0.06);
    --shadow-md:0 4px 16px rgba(21,38,63,0.08);
    --shadow-lg:0 12px 40px rgba(21,38,63,0.12);
    --radius:10px;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{ background:var(--ice-1); color:var(--ink); font-family:var(--font-body); -webkit-font-smoothing:antialiased; }
  ::selection{ background:var(--navy-corp); color:#fff; }

  .ik-nav{ background:var(--navy); border-top:3px solid var(--gold); padding:0 32px; position:sticky; top:0; z-index:100; box-shadow:0 2px 16px rgba(21,38,63,0.3); }
  .ik-nav-inner{ max-width:1100px; margin:0 auto; display:flex; align-items:center; justify-content:space-between; height:56px; }
  .ik-brand{ font-family:var(--font-display); font-weight:800; font-size:22px; color:#EEF1F6; text-decoration:none; letter-spacing:-0.5px; }
  .ik-gold{ color:var(--gold); }
  .ik-nav-links{ display:flex; gap:10px; align-items:center; }
  .ik-nav-links a{ font-family:var(--font-body); font-size:13px; font-weight:500; color:#8FA3C4; text-decoration:none; padding:8px 16px; border-radius:6px; transition:all .15s ease; }
  .ik-nav-links a:hover{ color:#fff; background:rgba(255,255,255,0.08); }
  #navUser{ font-family:var(--font-mono); font-size:12px; color:#8FA3C4; }
  .signout-btn{ font-family:var(--font-mono); font-size:11px; color:#8FA3C4; background:none; border:1px solid rgba(255,255,255,0.2); padding:6px 14px; border-radius:6px; cursor:pointer; transition:all .15s; margin-left:8px; }
  .signout-btn:hover{ border-color:var(--gold); color:var(--gold); }

  .page-head{ background:linear-gradient(135deg, var(--navy) 0%, var(--navy-corp) 100%); color:#EEF1F6; padding:32px; }
  .page-head-inner{ max-width:1100px; margin:0 auto; }
  .page-head h2{ font-family:var(--font-display); font-weight:800; font-size:24px; margin:0; }
  .back-link{ color:#8FA3C4; font-family:var(--font-mono); font-size:13px; text-decoration:none; display:inline-block; margin-bottom:8px; }
  .back-link:hover{ color:var(--gold); }

  .main{ max-width:1100px; margin:0 auto; padding:32px; }

  .hub-grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(260px, 1fr)); gap:20px; }
  .hub-card{ background:#fff; border-radius:var(--radius); box-shadow:var(--shadow-sm); padding:26px; text-decoration:none; color:inherit; display:flex; align-items:center; gap:16px; transition:box-shadow .15s, transform .15s; border:1px solid var(--ice-2); position:relative; }
  .hub-card:hover{ box-shadow:var(--shadow-md); transform:translateY(-2px); border-color:var(--ice-3); }
  .hub-card.gated{ display:none; }
  .hub-icon{ width:46px; height:46px; border-radius:12px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .hub-title{ font-family:var(--font-display); font-weight:700; font-size:16px; color:var(--navy); }
  .hub-badge{ position:absolute; top:14px; right:14px; background:var(--crimson); color:#fff; font-family:var(--font-display); font-weight:800; font-size:11px; min-width:22px; height:22px; border-radius:11px; display:none; align-items:center; justify-content:center; padding:0 6px; }

  .notice{ background:#fff; border-radius:var(--radius); padding:40px; text-align:center; box-shadow:var(--shadow-sm); color:var(--slate); font-size:14px; }
  .notice a{ color:var(--navy-corp); font-weight:600; text-decoration:none; }
</style>
</head>
<body>
  <nav class="ik-nav">
    <div class="ik-nav-inner">
      <a href="index.html" class="ik-brand">IK<span class="ik-gold">Aegis</span></a>
      <div class="ik-nav-links">
        <a href="index.html">Dashboard</a>
        <span id="navUser"></span>
        <button class="signout-btn" onclick="signOut()">Sign Out</button>
      </div>
    </div>
  </nav>

  <div class="page-head">
    <div class="page-head-inner">
      <a href="index.html" class="back-link">&larr; Back to dashboard</a>
      <h2>Access Requests</h2>
    </div>
  </div>

  <div class="main">
    <div class="hub-grid" id="hubGrid">

      <a class="hub-card" href="new-request.html">
        <div class="hub-icon" style="background:#FFF8E1;">
          <svg width="24" height="24" fill="none" stroke="#C1811E" stroke-width="2" stroke-linecap="round"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><path d="M14 2v6h6M16 13H8M16 17H8M10 9H8"/></svg>
        </div>
        <div class="hub-title">New Request</div>
      </a>

      <a class="hub-card" id="hubCreateUser" data-role="admin" href="create-user.html">
        <div class="hub-icon" style="background:#E3F5EA;">
          <svg width="24" height="24" fill="none" stroke="#00B050" stroke-width="2" stroke-linecap="round"><path d="M16 18v-2a4 4 0 00-8 0v2"/><circle cx="12" cy="7" r="4"/><path d="M19 8v6M22 11h-6"/></svg>
        </div>
        <div class="hub-title">Create User</div>
      </a>

      <a class="hub-card" id="hubInbox" data-role="approver" href="approvals.html">
        <div class="hub-icon" style="background:#FBE9E9;">
          <svg width="24" height="24" fill="none" stroke="#C33438" stroke-width="2" stroke-linecap="round"><path d="M22 12h-6l-2 3H10l-2-3H2"/><path d="M5.45 5.11L2 12v6a2 2 0 002 2h16a2 2 0 002-2v-6l-3.45-6.89A2 2 0 0016.76 4H7.24a2 2 0 00-1.79 1.11z"/></svg>
        </div>
        <div class="hub-title">Approval Inbox</div>
        <span class="hub-badge" id="hubInboxBadge">0</span>
      </a>

      <a class="hub-card" id="hubConfig" data-role="admin" href="approval-config.html">
        <div class="hub-icon" style="background:#EAF1FE;">
          <svg width="24" height="24" fill="none" stroke="#1F497D" stroke-width="2" stroke-linecap="round"><path d="M12 15a3 3 0 100-6 3 3 0 000 6z"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 01-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
        </div>
        <div class="hub-title">Approval Config</div>
      </a>

    </div>
  </div>

<script>
  // Option A (optimistic): admin-restricted tiles render immediately (zero lag for admin).
  // After profile loads, hide tiles the user's role may not access.
  (function(){
    fetch('/api/my-profile')
      .then(function(r){ if(!r.ok) throw new Error('401'); return r.json(); })
      .then(function(p){
        var nu=document.getElementById('navUser');
        if(nu && p && p.displayName) nu.textContent=p.displayName;
        var role=p.role;
        var isAdmin = role==='admin';
        var isApprover = (role==='admin' || role==='manager' || role==='role_owner');

        // Hide admin-only tiles for non-admins
        if(!isAdmin){
          var cu=document.getElementById('hubCreateUser'); if(cu) cu.classList.add('gated');
          var cf=document.getElementById('hubConfig');     if(cf) cf.classList.add('gated');
        }
        // Hide Approval Inbox for non-approver roles
        if(!isApprover){
          var ib=document.getElementById('hubInbox'); if(ib) ib.classList.add('gated');
        } else {
          // Load pending badge
          fetch('/api/approval-stats').then(function(r){ return r.json(); }).then(function(d){
            if(d && d.pending>0){
              var b=document.getElementById('hubInboxBadge');
              b.textContent=d.pending;
              b.style.display='flex';
            }
          }).catch(function(){});
        }
      })
      .catch(function(){
        document.querySelector('.main').innerHTML='<div class="notice">Please <a href="login.html">sign in</a> to view Access Requests.</div>';
      });
  })();

  function signOut(){
    fetch('/api/logout',{method:'POST'}).finally(function(){ window.location.href='login.html'; });
  }
</script>
</body>
</html>
