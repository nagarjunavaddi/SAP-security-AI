<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IKAegis - Create Access Review</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    --bg:#FFFFFF;
    --ice-1:#F5F7FA; --ice-2:#EDF2F8; --ice-3:#DCE5F0;
    --ink:#1E2A3A; --slate:#5A6A85; --slate-light:#8A95A8;
    --navy:#15263F; --navy-corp:#1F497D; --navy-dark:#002060;
    --crimson:#C33438; --green:#00B050; --gold:#FFC000; --amber:#C1811E;
    --font-display:'Sora',sans-serif; --font-body:'Inter',sans-serif; --font-mono:'IBM Plex Mono',monospace;
    --shadow-sm:0 1px 3px rgba(21,38,63,0.06);
    --shadow-md:0 4px 16px rgba(21,38,63,0.08);
    --shadow-lg:0 12px 40px rgba(21,38,63,0.12);
    --radius:10px;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{ background:var(--ice-1); color:var(--ink); font-family:var(--font-body); -webkit-font-smoothing:antialiased; }
  ::selection{ background:var(--navy-corp); color:#fff; }

  .ik-nav{ background:var(--navy); border-top:3px solid var(--gold); padding:0 32px; position:sticky; top:0; z-index:100; box-shadow:0 2px 16px rgba(21,38,63,0.3); }
  .ik-nav-inner{ max-width:1100px; margin:0 auto; display:flex; align-items:center; justify-content:space-between; height:56px; }
  .ik-brand{ font-family:var(--font-display); font-weight:800; font-size:22px; color:#EEF1F6; text-decoration:none; letter-spacing:-0.5px; }
  .ik-gold{ color:var(--gold); }
  .ik-nav-links{ display:flex; gap:10px; align-items:center; }
  .ik-nav-links a{ font-family:var(--font-body); font-size:13px; font-weight:500; color:#8FA3C4; text-decoration:none; padding:8px 16px; border-radius:6px; transition:all .15s ease; }
  .ik-nav-links a:hover{ color:#fff; background:rgba(255,255,255,0.08); }
  #navUser{ font-family:var(--font-mono); font-size:12px; color:#8FA3C4; }
  .signout-btn{ font-family:var(--font-mono); font-size:11px; color:#8FA3C4; background:none; border:1px solid rgba(255,255,255,0.2); padding:6px 14px; border-radius:6px; cursor:pointer; transition:all .15s; margin-left:8px; }
  .signout-btn:hover{ border-color:var(--gold); color:var(--gold); }

  .page-head{ background:linear-gradient(135deg, var(--navy) 0%, var(--navy-corp) 100%); color:#EEF1F6; padding:32px; }
  .page-head-inner{ max-width:1100px; margin:0 auto; }
  .page-head h2{ font-family:var(--font-display); font-weight:800; font-size:24px; margin:0 0 6px; }
  .page-head p{ font-size:13px; color:#B9C2D6; margin:0; max-width:560px; line-height:1.5; }

  .main{ max-width:1100px; margin:0 auto; padding:32px; }

  .card{ background:#fff; border-radius:var(--radius); box-shadow:var(--shadow-sm); padding:28px; margin-bottom:28px; }
  .card h3{ font-family:var(--font-display); font-weight:700; font-size:16px; color:var(--navy); margin-bottom:20px; }

  .field{ margin-bottom:18px; }
  .field label{ display:block; font-size:12px; font-family:var(--font-mono); text-transform:uppercase; letter-spacing:0.5px; color:var(--slate); margin-bottom:7px; }
  .field input[type=text], .field input[type=date], .field textarea{
    width:100%; padding:10px 12px; border:1px solid var(--ice-3); border-radius:8px;
    font-family:var(--font-body); font-size:14px; color:var(--ink); background:#fff;
  }
  .field textarea{ min-height:90px; resize:vertical; font-family:var(--font-mono); font-size:13px; }
  .field input:focus, .field textarea:focus{ outline:none; border-color:var(--navy-corp); }

  .scope-opts{ display:flex; gap:10px; flex-wrap:wrap; }
  .scope-opt{ flex:1; min-width:150px; border:1px solid var(--ice-3); border-radius:8px; padding:14px; cursor:pointer; transition:all .15s; }
  .scope-opt:hover{ border-color:var(--navy-corp); }
  .scope-opt.active{ border-color:var(--navy-corp); background:var(--ice-2); }
  .scope-opt input{ margin-right:8px; }
  .scope-opt .so-title{ font-weight:600; font-size:14px; color:var(--ink); }
  .scope-opt .so-desc{ font-size:12px; color:var(--slate); margin-top:4px; margin-left:22px; }

  .hidden{ display:none; }
  .hint{ font-size:12px; color:var(--slate); margin-top:6px; }
  .file-preview{ margin-top:10px; font-family:var(--font-mono); font-size:12px; color:var(--navy-corp); }

  .btn{ font-family:var(--font-body); font-size:14px; font-weight:600; padding:11px 24px; border-radius:8px; border:none; cursor:pointer; transition:all .15s; }
  .btn-primary{ background:var(--navy-corp); color:#fff; }
  .btn-primary:hover{ filter:brightness(1.08); }
  .btn-primary:disabled{ opacity:.6; cursor:not-allowed; }

  .section-header{ display:flex; align-items:baseline; gap:12px; margin-bottom:20px; }
  .section-header h2{ font-family:var(--font-display); font-weight:700; font-size:18px; color:var(--navy); letter-spacing:-0.2px; }
  .section-header .section-line{ flex:1; height:1px; background:var(--ice-3); }

  .camp{ background:#fff; border-radius:var(--radius); box-shadow:var(--shadow-sm); padding:20px 24px; margin-bottom:14px; }
  .camp-top{ display:flex; justify-content:space-between; align-items:flex-start; gap:16px; }
  .camp-name{ font-family:var(--font-display); font-weight:700; font-size:15px; color:var(--navy); }
  .camp-meta{ font-size:12px; color:var(--slate); margin-top:4px; font-family:var(--font-mono); }
  .camp-counts{ display:flex; gap:16px; margin-top:14px; }
  .camp-counts .cc{ font-size:12px; font-family:var(--font-mono); color:var(--slate); }
  .camp-counts .cc b{ font-family:var(--font-display); font-size:18px; display:block; }
  .cc.pending b{ color:var(--amber); } .cc.keep b{ color:var(--green); }
  .cc.revoke b{ color:var(--crimson); } .cc.total b{ color:var(--navy-corp); }
  .bar{ height:8px; background:var(--ice-2); border-radius:20px; margin-top:14px; overflow:hidden; }
  .bar-fill{ height:100%; background:var(--green); border-radius:20px; transition:width .3s; }

  /* ---- drill-down additions ---- */
  .badge{ display:inline-block; padding:3px 10px; border-radius:20px; font-family:var(--font-mono); font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:0.4px; }
  .badge.pending{ background:#FCF3E3; color:var(--amber); }
  .badge.keep{ background:#E3F5EA; color:var(--green); }
  .badge.revoke{ background:#FBE9E9; color:var(--crimson); }

  .crumb{ font-family:var(--font-mono); font-size:12px; color:var(--slate); margin-bottom:16px; }
  .crumb a{ color:var(--navy-corp); text-decoration:none; cursor:pointer; }
  .crumb a:hover{ text-decoration:underline; }

  .camp.clickable{ cursor:pointer; transition:box-shadow .15s; }
  .camp.clickable:hover{ box-shadow:var(--shadow-md); }
  .open-link{ background:var(--navy-corp); color:#fff; border:none; padding:8px 16px; border-radius:6px; font-family:var(--font-body); font-size:12px; font-weight:600; cursor:pointer; white-space:nowrap; }
  .open-link:hover{ filter:brightness(1.1); }

  .dtable{ width:100%; border-collapse:collapse; background:#fff; border-radius:var(--radius); overflow:hidden; box-shadow:var(--shadow-sm); }
  .dtable th{ background:var(--ice-2); font-family:var(--font-mono); font-size:11px; text-transform:uppercase; letter-spacing:0.5px; color:var(--slate); text-align:left; padding:12px 16px; border-bottom:1px solid var(--ice-3); }
  .dtable td{ padding:13px 16px; border-bottom:1px solid var(--ice-2); font-size:13px; vertical-align:middle; }
  .dtable tr:last-child td{ border-bottom:none; }
  .urow{ cursor:pointer; }
  .urow:hover td{ background:var(--ice-1); }
  .mono{ font-family:var(--font-mono); }
  .ubar{ width:120px; height:7px; background:var(--ice-3); border-radius:20px; overflow:hidden; display:inline-block; vertical-align:middle; margin-right:8px; }
  .ubar-fill{ height:100%; background:var(--green); border-radius:20px; }
  .summary-row{ display:flex; gap:28px; align-items:center; margin-bottom:20px; flex-wrap:wrap; }
  .summary-row .s-item{ font-family:var(--font-mono); font-size:12px; color:var(--slate); }
  .summary-row .s-item b{ font-family:var(--font-display); font-size:22px; color:var(--navy-corp); display:block; line-height:1.1; }

  .notice{ background:#fff; border-radius:var(--radius); padding:40px; text-align:center; box-shadow:var(--shadow-sm); color:var(--slate); font-size:14px; }
  .notice a{ color:var(--navy-corp); font-weight:600; text-decoration:none; }

  #toast{ position:fixed; bottom:24px; right:24px; background:var(--navy); color:#fff; padding:14px 20px; border-radius:8px; font-size:13px; box-shadow:var(--shadow-lg); opacity:0; transform:translateY(10px); transition:all .25s; pointer-events:none; z-index:200; border-left:3px solid var(--gold); max-width:360px; }
  #toast.show{ opacity:1; transform:translateY(0); }
  #toast.err{ border-left-color:var(--crimson); }
  /* Branded confirm modal */
  .ikmodal-overlay{ position:fixed; inset:0; background:rgba(21,38,63,.55); display:none; align-items:center; justify-content:center; z-index:9999; }
  .ikmodal-overlay.show{ display:flex; }
  .ikmodal{ background:#fff; border-radius:var(--radius); box-shadow:0 20px 60px rgba(0,0,0,.3); width:100%; max-width:440px; overflow:hidden; }
  .ikmodal-head{ background:var(--navy-corp,#1F497D); color:#fff; padding:16px 22px; font-size:16px; font-weight:700; }
  .ikmodal-body{ padding:22px; color:var(--slate,#5A6A85); font-size:14px; line-height:1.5; }
  .ikmodal-foot{ padding:14px 22px 20px; display:flex; gap:10px; justify-content:flex-end; }
  .ikmodal-btn{ padding:9px 18px; border-radius:8px; font-size:13px; font-weight:600; cursor:pointer; border:1px solid transparent; }
  .ikmodal-cancel{ background:#fff; color:var(--navy-corp,#1F497D); border-color:var(--navy-corp,#1F497D); }
  .ikmodal-ok{ background:var(--navy-corp,#1F497D); color:#fff; }
  .ikmodal-ok.danger{ background:var(--crimson,#C33438); }
</style>
</head>
<body>
<div class="ikmodal-overlay" id="ikModal">
  <div class="ikmodal">
    <div class="ikmodal-head" id="ikModalTitle">Confirm</div>
    <div class="ikmodal-body" id="ikModalBody"></div>
    <div class="ikmodal-foot">
      <button class="ikmodal-btn ikmodal-cancel" id="ikModalCancel">Cancel</button>
      <button class="ikmodal-btn ikmodal-ok" id="ikModalOk">Confirm</button>
    </div>
  </div>
</div>

  <nav class="ik-nav">
    <div class="ik-nav-inner">
      <a href="index.html" class="ik-brand">IK<span class="ik-gold">Aegis</span></a>
      <div class="ik-nav-links">
        <a href="index.html">Dashboard</a>
        <a href="uar-inbox.html">Review Inbox</a>
        <span id="navUser"></span>
        <button class="signout-btn" onclick="signOut()">Sign Out</button>
      </div>
    </div>
  </nav>

  <div class="page-head">
    <div class="page-head-inner">
      <a href='index.html' style='color:#8FA3C4;font-family:var(--font-mono);font-size:13px;text-decoration:none;display:inline-block;margin-bottom:8px;'>&larr; Back to dashboard</a>
      <h2>Create Access Review</h2>
    </div>
  </div>

  <div class="main">
    <div id="gate"></div>

    <div id="form-wrap" class="hidden">
      <div class="card">
        <h3>New Review Campaign</h3>

        <div class="field">
          <label>Campaign Name</label>
          <input type="text" id="campaignName" placeholder="e.g. Q3 2026 Access Recertification">
        </div>

        <div class="field">
          <label>Description (optional)</label>
          <input type="text" id="description" placeholder="Short note about this review">
        </div>

        <div class="field">
          <label>Due Date</label>
          <input type="date" id="dueDate">
        </div>

        <div class="field">
          <label>Scope - who to review</label>
          <div class="scope-opts">
            <label class="scope-opt active" id="opt-all">
              <div><input type="radio" name="scope" value="ALL" checked>All Users</div>
              <div class="so-desc">Every SAP user and their roles</div>
            </label>
            <label class="scope-opt" id="opt-users">
              <div><input type="radio" name="scope" value="USERS">Specific Users</div>
              <div class="so-desc">Paste a list of usernames</div>
            </label>
            <label class="scope-opt" id="opt-excel">
              <div><input type="radio" name="scope" value="EXCEL">Excel Upload</div>
              <div class="so-desc">Upload a .xlsx of usernames</div>
            </label>
          </div>
        </div>

        <div class="field hidden" id="users-field">
          <label>Usernames (one per line, or comma separated)</label>
          <textarea id="usersText" placeholder="NAG&#10;BHARGAV&#10;VENKATA"></textarea>
        </div>

        <div class="field hidden" id="excel-field">
          <label>Excel file (usernames in the first column)</label>
          <input type="file" id="excelFile" accept=".xlsx,.xls">
          <div class="file-preview" id="excelPreview"></div>
        </div>

        <button class="btn btn-primary" id="createBtn" onclick="createCampaign()">Create Campaign</button>
      </div>

      <div class="section-header">
        <h2>Campaigns</h2>
        <div class="section-line"></div>
      </div>
      <div id="campaignList"><div class="notice">Loading...</div></div>
    </div>
  </div>

  <div id="toast"></div>

<script>
  var byId = function(id){ return document.getElementById(id); };
  // Branded in-page confirm (replaces browser confirm). Returns a Promise<boolean>.
  function ikConfirm(message, opts){
    opts = opts || {};
    return new Promise(function(resolve){
      var ov = document.getElementById('ikModal');
      document.getElementById('ikModalTitle').textContent = opts.title || 'Confirm';
      document.getElementById('ikModalBody').textContent = message;
      var okBtn = document.getElementById('ikModalOk');
      var cancelBtn = document.getElementById('ikModalCancel');
      okBtn.textContent = opts.okText || 'Confirm';
      cancelBtn.textContent = opts.cancelText || 'Cancel';
      okBtn.className = 'ikmodal-btn ikmodal-ok' + (opts.danger ? ' danger' : '');
      function cleanup(val){ ov.classList.remove('show'); okBtn.onclick=null; cancelBtn.onclick=null; ov.onclick=null; resolve(val); }
      okBtn.onclick = function(){ cleanup(true); };
      cancelBtn.onclick = function(){ cleanup(false); };
      ov.onclick = function(e){ if(e.target === ov){ cleanup(false); } };
      ov.classList.add('show');
    });
  }
  var excelUsers = [];

  // ---- drill-down state ----
  var campaigns = [];
  var adminView = 'campaigns';   // campaigns | users | roles
  var currentCamp = null;
  var campUsers = [];
  var currentUser = null;

  function showToast(msg, isErr){
    var t = byId('toast');
    t.textContent = msg;
    t.className = isErr ? 'show err' : 'show';
    setTimeout(function(){ t.className = t.className.replace('show','').trim(); }, 3200);
  }

  function signOut(){
    fetch('/api/logout', { method:'POST', credentials:'same-origin' })
      .catch(function(){})
      .finally(function(){ window.location.href = 'login.html'; });
  }

  function esc(s){
    return (s == null ? '' : String(s)).replace(/[&<>"]/g, function(c){
      return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c];
    });
  }

  function fmtDate(d){
    if(!d) return '-';
    try{ return new Date(d).toLocaleDateString(undefined,{year:'numeric',month:'short',day:'numeric'}); }
    catch(e){ return '-'; }
  }

  function decBadge(d){ d = d || 'pending'; return '<span class="badge ' + d + '">' + d + '</span>'; }

  // ---- scope option switching ----
  function setScope(val){
    ['all','users','excel'].forEach(function(k){
      byId('opt-'+k).classList.toggle('active', ('opt-'+k) === ('opt-'+val.toLowerCase()));
    });
    byId('users-field').classList.toggle('hidden', val !== 'USERS');
    byId('excel-field').classList.toggle('hidden', val !== 'EXCEL');
  }
  document.querySelectorAll('input[name="scope"]').forEach(function(r){
    r.addEventListener('change', function(){ setScope(this.value); });
  });

  // ---- excel parsing (client-side) ----
  byId('excelFile').addEventListener('change', function(e){
    var file = e.target.files[0];
    if(!file){ excelUsers = []; byId('excelPreview').textContent = ''; return; }
    var reader = new FileReader();
    reader.onload = function(ev){
      try{
        var data = new Uint8Array(ev.target.result);
        var wb = XLSX.read(data, { type:'array' });
        var ws = wb.Sheets[wb.SheetNames[0]];
        var rows = XLSX.utils.sheet_to_json(ws, { header:1, blankrows:false });
        var list = [];
        rows.forEach(function(r, i){
          var first = (r[0] == null ? '' : String(r[0])).trim();
          if(!first) return;
          if(i === 0 && /user|uname|name|id/i.test(first)) return; // skip header row
          list.push(first.toUpperCase());
        });
        // dedupe
        excelUsers = list.filter(function(v, idx){ return list.indexOf(v) === idx; });
        byId('excelPreview').textContent = excelUsers.length + ' usernames found: ' + excelUsers.slice(0,8).join(', ') + (excelUsers.length > 8 ? ' ...' : '');
      }catch(err){
        excelUsers = [];
        byId('excelPreview').textContent = 'Could not read file: ' + err.message;
      }
    };
    reader.readAsArrayBuffer(file);
  });

  // ---- create ----
  async function createCampaign(){
    var name = byId('campaignName').value.trim();
    var desc = byId('description').value.trim();
    var due  = byId('dueDate').value;
    var scopeSel = document.querySelector('input[name="scope"]:checked').value;

    if(!name){ showToast('Campaign name is required', true); return; }

    var scopeType = 'ALL';
    var usernames = [];

    if(scopeSel === 'USERS'){
      scopeType = 'USERS';
      usernames = byId('usersText').value.split(/[\n,]+/).map(function(s){ return s.trim().toUpperCase(); }).filter(Boolean);
      if(!usernames.length){ showToast('Enter at least one username', true); return; }
    } else if(scopeSel === 'EXCEL'){
      scopeType = 'USERS';
      usernames = excelUsers.slice();
      if(!usernames.length){ showToast('Upload an Excel file with usernames first', true); return; }
    } else {
      if(!(await ikConfirm('This will create a review for ALL users and their roles. This can be a large campaign. Continue?', { title:'Create Campaign', okText:'Continue' }))) return;
    }

    var btn = byId('createBtn');
    btn.disabled = true;
    var oldText = btn.textContent;
    btn.textContent = 'Creating... (pulling from SAP)';

    try{
      var res = await fetch('/api/uar/campaigns', {
        method:'POST',
        headers:{ 'Content-Type':'application/json' },
        credentials:'same-origin',
        body: JSON.stringify({ campaignName:name, description:desc, dueDate:due||null, scopeType:scopeType, usernames:usernames })
      });
      var data = await res.json();
      if(!res.ok){ showToast(data.error || 'Create failed', true); return; }
      var msg = 'Campaign created: ' + data.itemsCreated + ' items';
      if(data.unassigned){ msg += ' (' + data.unassigned + ' unassigned - no role owner)'; }
      showToast(msg, false);
      // reset form lightly
      byId('campaignName').value = '';
      byId('description').value = '';
      loadCampaigns();
    }catch(err){
      showToast('Create failed: ' + err.message, true);
    }finally{
      btn.disabled = false;
      btn.textContent = oldText;
    }
  }

  // ---- L1: campaign list ----
  function renderCampaigns(){
    adminView = 'campaigns';
    if(!campaigns.length){
      byId('campaignList').innerHTML = '<div class="notice">No campaigns yet. Create one above.</div>';
      return;
    }
    var html = '';
    campaigns.forEach(function(c){
      var reviewed = c.total - c.pending;
      var pct = c.total ? Math.round((reviewed / c.total) * 100) : 0;
      html += '<div class="camp clickable" onclick="openCampaign(' + c.id + ')">'
        + '<div class="camp-top"><div>'
          + '<div class="camp-name">' + esc(c.campaignName) + '</div>'
          + '<div class="camp-meta">Scope: ' + esc(c.scopeType || '-') + '  |  Due: ' + fmtDate(c.dueDate) + '  |  By: ' + esc(c.createdBy || '-') + '</div>'
        + '</div><button class="open-link" onclick="event.stopPropagation();openCampaign(' + c.id + ')">Open &rarr;</button></div>'
        + '<div class="camp-counts">'
          + '<div class="cc pending"><b>' + c.pending + '</b>Pending</div>'
          + '<div class="cc keep"><b>' + c.keep + '</b>Keep</div>'
          + '<div class="cc revoke"><b>' + c.revoke + '</b>Revoke</div>'
          + '<div class="cc total"><b>' + c.total + '</b>Total</div>'
        + '</div>'
        + '<div class="bar"><div class="bar-fill" style="width:' + pct + '%"></div></div>'
        + '<div class="camp-meta" style="margin-top:6px;">' + pct + '% reviewed</div>'
        + '</div>';
    });
    byId('campaignList').innerHTML = html;
  }

  // ---- L2: users in a campaign ----
  async function openCampaign(id){
    var c = campaigns.find(function(x){ return x.id === id; });
    currentCamp = c || { id:id, campaignName:'Campaign', total:0, pending:0, keep:0, revoke:0 };
    byId('campaignList').innerHTML = '<div class="notice">Loading users...</div>';
    try{
      var res = await fetch('/api/uar/campaign/' + id + '/users', { credentials:'same-origin' });
      if(!res.ok){ throw new Error('HTTP ' + res.status); }
      var data = await res.json();
      campUsers = data.users || [];
      renderUsers();
    }catch(err){
      byId('campaignList').innerHTML = '<div class="notice">Failed to load users. ' + esc(err.message) + '</div>';
    }
  }

  function renderUsers(){
    adminView = 'users';
    var c = currentCamp;
    var reviewed = c.total - c.pending;
    var pct = c.total ? Math.round((reviewed / c.total) * 100) : 0;

    var html = '';
    html += '<div class="crumb"><a onclick="backToCampaigns()">Campaigns</a> &nbsp;/&nbsp; ' + esc(c.campaignName) + '</div>';
    var _st = (c.status || 'active');
    var _stCls = (_st === 'completed') ? 'keep' : 'pending';
    html += '<div class="fa-actionbar" style="display:flex;align-items:center;gap:12px;margin:12px 0 6px;flex-wrap:wrap;">'
      + '<span class="badge ' + _stCls + '" style="font-size:13px;">Status: ' + esc(_st) + '</span>'
      + '<div style="flex:1;"></div>'
      + (_st === 'completed'
          ? '<button disabled style="background:#e8ede8;color:#5a6b5a;border:none;padding:8px 16px;border-radius:8px;font-size:13px;font-weight:600;cursor:default;">Completed</button>'
          : '<button onclick="markComplete()" style="background:var(--navy);color:#fff;border:none;padding:8px 16px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:600;">Mark Complete</button>')
      + '<button onclick="exportReport()" style="background:#fff;color:var(--navy);border:1px solid var(--navy);padding:8px 16px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:600;">Export Report (Excel)</button>'
      + '</div>';
    html += '<div class="summary-row">'
      + '<div class="s-item"><b>' + campUsers.length + '</b>Users</div>'
      + '<div class="s-item"><b>' + c.total + '</b>Total items</div>'
      + '<div class="s-item"><b>' + c.pending + '</b>Pending</div>'
      + '<div class="s-item"><b>' + reviewed + '</b>Reviewed</div>'
      + '<div class="s-item" style="flex:1;min-width:180px;"><div class="ubar" style="width:70%;"><div class="ubar-fill" style="width:' + pct + '%"></div></div>' + pct + '% reviewed</div>'
      + '</div>';

    if(!campUsers.length){
      html += '<div class="notice">No users in this campaign.</div>';
      byId('campaignList').innerHTML = html;
      return;
    }

    var rows = '';
    campUsers.forEach(function(u){
      var ur = u.total - u.pending;
      var upct = u.total ? Math.round((ur / u.total) * 100) : 0;
      rows += '<tr class="urow" onclick="openUser(\'' + esc(u.username) + '\')">'
        + '<td class="mono" style="font-weight:600;color:var(--navy);">' + esc(u.username) + '</td>'
        + '<td>' + u.total + ' role' + (u.total===1?'':'s') + '</td>'
        + '<td><div class="ubar"><div class="ubar-fill" style="width:' + upct + '%"></div></div>' + ur + '/' + u.total + '</td>'
        + '<td><span class="badge pending">' + u.pending + ' pending</span> <span class="badge keep">' + u.keep + ' keep</span> <span class="badge revoke">' + u.revoke + ' revoke</span></td>'
        + '<td style="text-align:right;"><button class="open-link" onclick="event.stopPropagation();openUser(\'' + esc(u.username) + '\')">View &rarr;</button></td>'
        + '</tr>';
    });
    html += '<table class="dtable"><thead><tr><th>User</th><th>Roles</th><th>Progress</th><th>Breakdown</th><th></th></tr></thead><tbody>' + rows + '</tbody></table>';
    byId('campaignList').innerHTML = html;
  }

  // ---- L3: roles for one user (read-only) ----
  async function openUser(username){
    currentUser = username;
    byId('campaignList').innerHTML = '<div class="notice">Loading roles...</div>';
    try{
      var res = await fetch('/api/uar/campaign/' + currentCamp.id + '/user/' + encodeURIComponent(username) + '/roles', { credentials:'same-origin' });
      if(!res.ok){ throw new Error('HTTP ' + res.status); }
      var data = await res.json();
      renderRoles(username, data.roles || []);
    }catch(err){
      byId('campaignList').innerHTML = '<div class="notice">Failed to load roles. ' + esc(err.message) + '</div>';
    }
  }

  function renderRoles(username, roles){
    adminView = 'roles';
    var html = '';
    html += '<div class="crumb"><a onclick="backToCampaigns()">Campaigns</a> &nbsp;/&nbsp; <a onclick="renderUsers()">' + esc(currentCamp.campaignName) + '</a> &nbsp;/&nbsp; ' + esc(username) + '</div>';

    if(!roles.length){
      html += '<div class="notice">No roles for this user.</div>';
      byId('campaignList').innerHTML = html;
      return;
    }

    var rows = '';
    roles.forEach(function(r){
      rows += '<tr>'
        + '<td class="mono" style="font-weight:600;">' + esc(r.roleName) + '</td>'
        + '<td>' + decBadge(r.decision) + '</td>'
        + '<td class="mono">' + esc(r.reviewer || '-') + '</td>'
        + '<td>' + (r.comment ? esc(r.comment) : '<span style="color:var(--slate-light);">-</span>') + '</td>'
        + '</tr>';
    });
    html += '<table class="dtable"><thead><tr><th>Role</th><th>Decision</th><th>Reviewer</th><th>Comment</th></tr></thead><tbody>' + rows + '</tbody></table>';
    byId('campaignList').innerHTML = html;
  }

  function backToCampaigns(){
    // refresh L1 counts (decisions may have changed since load)
    loadCampaigns();
  }

  // ---- Feature A: finalize + Excel audit report ----
  async function markComplete(){
    var c = currentCamp;
    if(!c || !c.id){ return; }
    var msg;
    if(c.pending > 0){
      msg = c.pending + ' item(s) are still pending. If you complete now, they will be recorded as "pending" in the audit report. Continue?';
    } else {
      msg = 'Mark campaign "' + c.campaignName + '" as complete?';
    }
    var _pend = (c.pending > 0);
    if(!(await ikConfirm(msg, { title:'Mark Complete', okText:'Mark Complete', danger:_pend }))){ return; }
    try{
      var res = await fetch('/api/uar/campaign/' + c.id + '/finalize', { method:'POST', credentials:'same-origin' });
      if(!res.ok){ throw new Error('HTTP ' + res.status); }
      var data = await res.json();
      currentCamp.status = (data.campaign && data.campaign.status) || 'completed';
      var idx = campaigns.findIndex(function(x){ return x.id === c.id; });
      if(idx >= 0){ campaigns[idx].status = currentCamp.status; }
      showToast('Campaign marked complete.', false);
      renderUsers();
    }catch(err){
      showToast('Failed to finalize: ' + err.message, true);
    }
  }

  async function exportReport(){
    var c = currentCamp;
    if(!c || !c.id){ return; }
    try{
      var res = await fetch('/api/uar/campaign/' + c.id + '/report', { credentials:'same-origin' });
      if(!res.ok){ throw new Error('HTTP ' + res.status); }
      var data = await res.json();
      var items = data.items || [];
      if(!items.length){ showToast('No items to export.', true); return; }

      var detail = items.map(function(it){
        var assigned = it.reviewer;
        var isPool = (String(it.reviewer || '').toUpperCase() === 'ADMIN');
        var effectiveReviewer = (isPool && it.reviewedBy) ? it.reviewedBy : (it.reviewedBy || it.reviewer);
        var assignedLabel = isPool ? 'ADMIN (pool)' : assigned;
        return {
          Campaign: it.campaignName,
          User: it.username,
          Role: it.roleName,
          'Assigned Reviewer': assignedLabel,
          'Reviewed By': effectiveReviewer,
          Decision: it.decision,
          Comment: it.comment || '',
          'Decided By': it.reviewedBy || '',
          'Decided At': fmtDate(it.reviewedAt),
          'SAP Sync': it.sapSyncStatus || ''
        };
      });
      var wsDetail = XLSX.utils.json_to_sheet(detail);

      var totals = { keep:0, revoke:0, pending:0 };
      var perRev = {};
      items.forEach(function(it){
        var d = it.decision || 'pending';
        if(totals[d] === undefined){ totals[d] = 0; }
        totals[d]++;
        var _pool = (String(it.reviewer || '').toUpperCase() === 'ADMIN');
        var rev = (_pool && it.reviewedBy) ? it.reviewedBy : (it.reviewer || '(unassigned)');
        if(!perRev[rev]){ perRev[rev] = { keep:0, revoke:0, pending:0 }; }
        if(perRev[rev][d] === undefined){ perRev[rev][d] = 0; }
        perRev[rev][d]++;
      });
      var summaryRows = [];
      summaryRows.push({ Metric:'Campaign', Value: c.campaignName });
      summaryRows.push({ Metric:'Status', Value: currentCamp.status || 'active' });
      summaryRows.push({ Metric:'Exported at', Value: new Date().toLocaleString() });
      summaryRows.push({ Metric:'Total items', Value: items.length });
      summaryRows.push({ Metric:'Keep', Value: totals.keep });
      summaryRows.push({ Metric:'Revoke', Value: totals.revoke });
      summaryRows.push({ Metric:'Pending', Value: totals.pending });
      summaryRows.push({ Metric:'', Value:'' });
      summaryRows.push({ Metric:'Per-reviewer', Value:'Keep / Revoke / Pending' });
      Object.keys(perRev).forEach(function(rev){
        var p = perRev[rev];
        summaryRows.push({ Metric: rev, Value: (p.keep||0) + ' / ' + (p.revoke||0) + ' / ' + (p.pending||0) });
      });
      var wsSummary = XLSX.utils.json_to_sheet(summaryRows);

      var wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, wsSummary, 'Summary');
      XLSX.utils.book_append_sheet(wb, wsDetail, 'Line Items');

      var safeName = (c.campaignName || 'campaign').replace(/[^a-z0-9]+/gi,'_').substring(0,40);
      var stamp = new Date().toISOString().slice(0,10);
      XLSX.writeFile(wb, 'UAR_' + safeName + '_' + stamp + '.xlsx');
      showToast('Report exported.', false);
    }catch(err){
      showToast('Export failed: ' + err.message, true);
    }
  }

  // ---- initial load / L1 fetch ----
  async function loadCampaigns(){
    try{
      var res = await fetch('/api/uar/campaigns', { credentials:'same-origin' });
      if(res.status === 401){
        byId('gate').innerHTML = '<div class="notice">You are not signed in. Please <a href="login.html">log in</a> as an admin to create reviews.</div>';
        byId('form-wrap').classList.add('hidden');
        return;
      }
      if(res.status === 403){
        byId('gate').innerHTML = '<div class="notice">Only admins can create review campaigns.</div>';
        byId('form-wrap').classList.add('hidden');
        return;
      }
      if(!res.ok){ throw new Error('HTTP ' + res.status); }
      var data = await res.json();
      byId('gate').innerHTML = '';
      byId('form-wrap').classList.remove('hidden');
      campaigns = data.campaigns || [];
      renderCampaigns();
    }catch(err){
      byId('campaignList').innerHTML = '<div class="notice">Failed to load campaigns. ' + esc(err.message) + '</div>';
    }
  }

  loadCampaigns();
</script>
</body>
</html>
